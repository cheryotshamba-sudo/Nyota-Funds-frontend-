<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#0B0217;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    width:100%;
    background:#16052B;
    border:1px solid #6C1D99;
    border-radius:18px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 0 25px rgba(155,53,255,0.25);
}

.success{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#9B35FF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    box-shadow:0 0 20px rgba(155,53,255,0.45);
}

h1{
    color:#9B35FF;
    font-size:26px;
    margin-bottom:18px;
}

p{
    color:#E9DDF5;
    font-size:15px;
    line-height:1.6;
    margin-bottom:14px;
}

b{
    color:#fff;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    background:#9B35FF;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#6C1D99;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="success">✅</div>

<h1>Payment Successful</h1>

<p>
Congratulations <b><span id="name"></span></b>!
</p>

<p>
Your payment has been received successfully.
</p>

<p>
Your NYOTA FUNDS request has been submitted successfully.
</p>

<p>
Our team is verifying your application. You will receive further communication after verification is complete.
</p>

<button onclick="finish()">
Finish
</button>

</div>

</div>

<script>

const applicant =
    localStorage.getItem("fullName") ||
    localStorage.getItem("applicantName") ||
    "Applicant";

document.getElementById("name").textContent = applicant;

function finish(){

    alert("Thank you for choosing NYOTA FUNDS.");

}

</script>

</body>
</html>
