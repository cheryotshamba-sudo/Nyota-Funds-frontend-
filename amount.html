<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    padding:18px 0 12px;
    display:flex;
    flex-direction:column;
}

/* TITLE */

h1{
    text-align:center;
    color:#D4AF37;
    font-size:25px;
    font-weight:700;
    line-height:1.15;
    margin-bottom:10px;
}

/* MESSAGE */

.message{
    text-align:center;
    font-size:15px;
    font-weight:400;
    line-height:1.32;
    padding:0 5px;
    margin-bottom:10px;
    color:rgba(255,255,255,0.72);
}

.message b{
    color:#D4AF37;
    font-weight:700;
}

/* AMOUNT TITLE */

h2{
    text-align:center;
    color:#D4AF37;
    font-size:17px;
    font-weight:700;
    line-height:1.2;
    margin-bottom:10px;
}

/* AMOUNT GRID */

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px 17px;
    width:100%;
}

.amount-btn{
    width:100%;
    height:58px;
    background:rgba(212,175,55,0.055);
    color:#fff;
    border:1px solid rgba(212,175,55,0.25);
    border-radius:15px;
    padding:8px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.amount-btn:hover{
    border-color:#D4AF37;
}

.amount-btn.selected{
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border-color:#D4AF37;
}

/* FEE */

#feeDisplay{
    margin-top:15px;
    text-align:center;
    font-size:15px;
    font-weight:400;
    min-height:24px;
    color:rgba(255,255,255,0.85);
}

#feeDisplay span{
    font-size:17px;
    font-weight:700;
    color:#D4AF37;
}

/* CONTINUE */

.continue-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 15px auto 10px;
    padding: 14px 20px;
    background: #00A651;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    z-index: 10;
    visibility: visible;
    opacity: 1;
}

.continue-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}


/* SMALL PHONES */

@media(max-width:380px){

    .container{
        padding-top:12px;
        padding-bottom:8px;
    }

    h1{
        font-size:22px;
        margin-bottom:8px;
    }

    .message{
        font-size:13px;
        line-height:1.28;
        margin-bottom:8px;
    }

    h2{
        font-size:15px;
        margin-bottom:8px;
    }

    .amount-grid{
        gap:7px 10px;
    }

    .amount-btn{
        height:52px;
        font-size:14px;
        border-radius:13px;
    }

    #feeDisplay{
        margin-top:10px;
        font-size:14px;
        min-height:22px;
    }

    #feeDisplay span{
        font-size:15px;
    }

    .continue-btn{
        height:54px;
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="container">

<h1>NYOTA FUNDS KENYA</h1>

<div class="message">

Congratulations 🎉 <span id="applicantName"></span><br><br>

You're eligible for <b>NYOTA Funds Limits.</b><br>

Kindly choose the amount you want and pay the
<b>program processing fee</b> to continue.

</div>

<h2>Select Your NYOTA FUNDS AMOUNT</h2>

<div class="amount-grid">

<button class="amount-btn"
onclick="selectAmount(22000,this)">
Ksh 22,000
</button>

<button class="amount-btn"
onclick="selectAmount(30000,this)">
Ksh 30,000
</button>

<button class="amount-btn"
onclick="selectAmount(40000,this)">
Ksh 40,000
</button>

<button class="amount-btn"
onclick="selectAmount(50000,this)">
Ksh 50,000
</button>

<button class="amount-btn"
onclick="selectAmount(65000,this)">
Ksh 65,000
</button>

<button class="amount-btn"
onclick="selectAmount(75000,this)">
Ksh 75,000
</button>

<button class="amount-btn"
onclick="selectAmount(85000,this)">
Ksh 85,000
</button>

<button class="amount-btn"
onclick="selectAmount(110000,this)">
Ksh 110,000
</button>

<button class="amount-btn"
onclick="selectAmount(150000,this)">
Ksh 150,000
</button>

</div>

<div id="feeDisplay">
Select an amount to see the processing fee.
</div>

<button
class="continue-btn"
onclick="continueNext()">

Continue

</button>

</div>

<script>

const fees = {

22000:350,
30000:400,
40000:450,
50000:520,
65000:660,
75000:780,
85000:5,
110000:1250,
150000:1500

};

let selectedAmount = null;

document.getElementById("applicantName").textContent =
localStorage.getItem("applicantName") || "Applicant";


function selectAmount(amount, btn){

    selectedAmount = amount;

    document
    .querySelectorAll(".amount-btn")
    .forEach(button=>{
        button.classList.remove("selected");
    });

    btn.classList.add("selected");

    document.getElementById("feeDisplay").innerHTML =
    "Processing Fee: <span>Ksh " +
    fees[amount].toLocaleString() +
    "</span>";

    localStorage.setItem(
        "selectedAmount",
        amount
    );

    localStorage.setItem(
        "processingFee",
        fees[amount]
    );

}


function continueNext(){

    if(selectedAmount === null){

        alert("Please select an amount first.");

        return;

    }

    const button =
    document.querySelector(".continue-btn");

    button.textContent =
    "Processing...";

    button.disabled = true;

    button.style.opacity =
    "0.7";

    button.style.cursor =
    "not-allowed";

    

        window.location.href =
        "payment.html";



}

</script>

</body>
</html>
