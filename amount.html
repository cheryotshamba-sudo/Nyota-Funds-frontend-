<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#0B0217;
    color:#fff;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    padding:18px 20px 105px;
    position:relative;
}

/* ===============================
   FIXED TOP CONTENT
================================ */

.fixed-header{
    position:relative;
    z-index:10;
    background:#0B0217;
}

h1{
    text-align:center;
    color:#D4AF37;
    font-size:36px;
    font-weight:700;
    margin-bottom:18px;
}

.message{
    text-align:center;
    font-size:27px;
    font-weight:400;
    line-height:1.4;
    margin-bottom:22px;
    color:rgba(255,255,255,0.85);
}

.message b{
    color:#D4AF37;
    font-weight:700;
}

h2{
    text-align:center;
    color:#D4AF37;
    font-size:27px;
    font-weight:700;
    margin-bottom:18px;
}

/* ===============================
   AMOUNTS ONLY SCROLL
================================ */

.amount-area{
    height:calc(100vh - 390px);
    overflow-y:auto;
    padding-bottom:30px;
    scrollbar-width:none;
}

.amount-area::-webkit-scrollbar{
    display:none;
}

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.amount-btn{
    background:rgba(212,175,55,0.055);
    color:#fff;
    border:1px solid rgba(212,175,55,0.28);
    border-radius:15px;
    padding:18px 10px;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.amount-btn.selected{
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border-color:#D4AF37;
}

#feeDisplay{
    margin:25px 0;
    text-align:center;
    font-size:24px;
    font-weight:400;
    min-height:30px;
    color:rgba(255,255,255,0.85);
}

#feeDisplay span{
    font-size:27px;
    font-weight:700;
}

/* ===============================
   FIXED CONTINUE
================================ */

.continue-btn{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:calc(100% - 40px);
    max-width:460px;
    padding:18px;
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border:none;
    border-radius:15px;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.continue-btn:disabled{
    opacity:.7;
}
    

</style>

</head>

<body>

<div class="container">

<h1>NYOTA FUNDS KENYA</h1>

<div class="message">

Congratulations 🎉 <span id="applicantName"></span><br><br>

You're eligible for <b>NYOTA Funds Limits.</b><br>

Kindly choose the amount you want and pay the processing fee to continue.

</div>

<h2>Select Your NYOTA Fund Amount</h2>

<div class="amount-grid">

<button class="amount-btn" onclick="selectAmount(22000,this)">Ksh 22,000</button>

<button class="amount-btn" onclick="selectAmount(30000,this)">Ksh 30,000</button>

<button class="amount-btn" onclick="selectAmount(40000,this)">Ksh 40,000</button>

<button class="amount-btn" onclick="selectAmount(50000,this)">Ksh 50,000</button>

<button class="amount-btn" onclick="selectAmount(65000,this)">Ksh 65,000</button>

<button class="amount-btn" onclick="selectAmount(75000,this)">Ksh 75,000</button>

<button class="amount-btn" onclick="selectAmount(85000,this)">Ksh 85,000</button>

<button class="amount-btn" onclick="selectAmount(110000,this)">Ksh 110,000</button>

<button class="amount-btn" onclick="selectAmount(150000,this)">Ksh 150,000</button>

</div>

<div id="feeDisplay">
Select an amount to see the processing fee.
</div>

<button class="continue-btn" onclick="continueNext()">
Continue
</button>
<script>

const fees = {
22000:350,
30000:400,
40000:460,
50000:520,
65000:660,
75000:780,
85000:900,
110000:1240,
150000:1500
};

let selectedAmount = null;
  
document.getElementById("applicantName").textContent =
localStorage.getItem("applicantName") || "Applicant";
function selectAmount(amount, btn){

selectedAmount = amount;

document.querySelectorAll(".amount-btn").forEach(button=>{
button.classList.remove("selected");
});

btn.classList.add("selected");

document.getElementById("feeDisplay").innerHTML =
"Processing Fee: <span style='color:#00ff66;'>Ksh " +
fees[amount].toLocaleString() +
"</span>";

localStorage.setItem("selectedAmount", amount);
localStorage.setItem("processingFee", fees[amount]);

}

function continueNext(){

if(selectedAmount === null){
alert("Please select an amount first.");
return;
}

const button = document.querySelector(".continue-btn");

button.textContent = "Processing...";
button.disabled = true;
button.style.opacity = "0.7";
button.style.cursor = "not-allowed";

setTimeout(() => {
    window.location.href = "payment.html";
}, 1000);

}

</script>

</body>
                                                                          </html>
