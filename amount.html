<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#0B0217;
    color:#fff;
    min-height:100vh;
}

.container{
    max-width:500px;
    width:100%;
    margin:auto;
    min-height:100vh;
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
}

/* TITLE */

h1{
    text-align:center;
    color:#D4AF37;
    font-size:28px;
    font-weight:700;
    margin-bottom:18px;
    line-height:1.2;
}

/* MESSAGE */

.message{
    text-align:center;
    font-size:17px;
    font-weight:400;
    line-height:1.45;
    margin-bottom:18px;
    padding:0 8px;
    color:rgba(255,255,255,0.72);
}

.message b{
    color:#D4AF37;
    font-weight:700;
}

/* SUB TITLE */

h2{
    text-align:center;
    color:#D4AF37;
    font-size:19px;
    font-weight:700;
    margin-bottom:16px;
    line-height:1.25;
}

/* AMOUNT GRID */

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 17px;
    width:100%;
}

.amount-btn{
    width:100%;
    height:70px;
    background:rgba(212,175,55,0.055);
    color:#fff;
    border:1px solid rgba(212,175,55,0.25);
    border-radius:15px;
    padding:10px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.amount-btn:hover{
    border-color:#D4AF37;
}

.amount-btn.selected{
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border-color:#D4AF37;
}

/* FEE DISPLAY */

#feeDisplay{
    margin:28px 0 0;
    text-align:center;
    font-size:17px;
    font-weight:400;
    min-height:30px;
    color:rgba(255,255,255,0.85);
}

#feeDisplay span{
    font-size:19px;
    font-weight:700;
    color:#D4AF37;
}

/* CONTINUE BUTTON */

.continue-btn{
    margin-top:55px;
    width:100%;
    height:72px;
    padding:10px;
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border:none;
    border-radius:15px;
    font-size:19px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}


/* SMALL PHONES */

@media(max-width:380px){

    .container{
        padding-top:22px;
    }

    h1{
        font-size:25px;
        margin-bottom:15px;
    }

    .message{
        font-size:15px;
        line-height:1.4;
        margin-bottom:15px;
    }

    h2{
        font-size:17px;
        margin-bottom:14px;
    }

    .amount-grid{
        gap:12px 12px;
    }

    .amount-btn{
        height:64px;
        font-size:15px;
        border-radius:14px;
    }

    #feeDisplay{
        margin-top:24px;
        font-size:15px;
    }

    #feeDisplay span{
        font-size:17px;
    }

    .continue-btn{
        margin-top:45px;
        height:66px;
        font-size:17px;
    }
}

</style>

</head>

<body>

<div class="container">

    <h1>NYOTA FUNDS KENYA</h1>

    <div class="message">

        Congratulations 🎉 <span id="applicantName"></span><br><br>

        You're eligible for <b>NYOTA Funds Limits.</b><br>

        Kindly choose the amount you want and pay the
        <b>program processing fee</b> to continue.

    </div>

    <h2>Select Your NYOTA FUNDS AMOUNT</h2>

    <div class="amount-grid">

        <button
            class="amount-btn"
            onclick="selectAmount(22000,this)">
            Ksh 22,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(30000,this)">
            Ksh 30,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(40000,this)">
            Ksh 40,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(50000,this)">
            Ksh 50,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(65000,this)">
            Ksh 65,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(75000,this)">
            Ksh 75,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(85000,this)">
            Ksh 85,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(110000,this)">
            Ksh 110,000
        </button>

        <button
            class="amount-btn"
            onclick="selectAmount(150000,this)">
            Ksh 150,000
        </button>

    </div>

    <div id="feeDisplay">
        Select an amount to see the processing fee.
    </div>

    <button
        class="continue-btn"
        onclick="continueNext()">
        Continue
    </button>

</div>


<script>

const fees = {

    22000: 350,
    30000: 400,
    40000: 450,
    50000: 520,
    65000: 660,
    75000: 780,
    85000: 910,
    110000: 1250,
    150000: 1500

};

let selectedAmount = null;


/* GET APPLICANT NAME */

document.getElementById("applicantName").textContent =
    localStorage.getItem("applicantName") || "Applicant";


/* SELECT AMOUNT */

function selectAmount(amount, btn){

    selectedAmount = amount;

    document
        .querySelectorAll(".amount-btn")
        .forEach(button => {
            button.classList.remove("selected");
        });

    btn.classList.add("selected");

    document.getElementById("feeDisplay").innerHTML =
        "Processing Fee: <span>Ksh " +
        fees[amount].toLocaleString() +
        "</span>";

    localStorage.setItem(
        "selectedAmount",
        amount
    );

    localStorage.setItem(
        "processingFee",
        fees[amount]
    );

}


/* CONTINUE */

function continueNext(){

    if(selectedAmount === null){

        alert("Please select an amount first.");

        return;

    }

    const button =
        document.querySelector(".continue-btn");

    button.textContent =
        "Processing...";

    button.disabled = true;

    button.style.opacity =
        "0.7";

    button.style.cursor =
        "not-allowed";


    setTimeout(() => {

        window.location.href =
            "payment.html";

    },1000);

}

</script>

</body>
</html>
