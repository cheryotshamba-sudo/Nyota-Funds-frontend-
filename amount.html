<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:500px;
    height:100vh;
    min-height:100vh;
    margin:auto;
    padding:12px 16px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ===============================
   TITLE
================================ */

h1{
    text-align:center;
    color:#D4AF37;
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
    flex-shrink:0;
}

/* ===============================
   MESSAGE
================================ */

.message{
    text-align:center;
    font-size:18px;
    font-weight:400;
    line-height:1.25;
    margin-bottom:9px;
    color:rgba(255,255,255,0.85);
    flex-shrink:0;
}

.message b{
    color:#D4AF37;
    font-weight:700;
}

/* ===============================
   HEADING
================================ */

h2{
    text-align:center;
    color:#D4AF37;
    font-size:20px;
    font-weight:700;
    margin-bottom:9px;
    flex-shrink:0;
}

/* ===============================
   AMOUNTS
================================ */

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    flex-shrink:0;
}

.amount-btn{
    background:rgba(212,175,55,0.055);
    color:#fff;
    border:1px solid rgba(212,175,55,0.28);
    border-radius:10px;
    padding:10px 6px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    min-height:43px;
}

.amount-btn.selected{
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border-color:#D4AF37;
}

/* ===============================
   FEE
================================ */

#feeDisplay{
    margin:8px 0;
    text-align:center;
    font-size:17px;
    font-weight:400;
    min-height:21px;
    color:rgba(255,255,255,0.85);
    flex-shrink:0;
}

#feeDisplay span{
    font-size:19px;
    font-weight:700;
}

/* ===============================
   CONTINUE
================================ */

.continue-btn{
    margin-top:auto;
    width:100%;
    padding:11px;
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border:none;
    border-radius:10px;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
}

/* ===============================
   VERY SMALL PHONES
================================ */

@media(max-height:650px){

    .container{
        padding:8px 14px;
    }

    h1{
        font-size:25px;
        margin-bottom:5px;
    }

    .message{
        font-size:15px;
        line-height:1.18;
        margin-bottom:6px;
    }

    h2{
        font-size:17px;
        margin-bottom:6px;
    }

    .amount-grid{
        gap:5px;
    }

    .amount-btn{
        padding:8px 5px;
        min-height:36px;
        font-size:15px;
        border-radius:8px;
    }

    #feeDisplay{
        margin:5px 0;
        font-size:14px;
    }

    #feeDisplay span{
        font-size:16px;
    }

    .continue-btn{
        padding:9px;
        font-size:17px;
        border-radius:9px;
    }
}


</style>

</head>

<body>

<div class="container">

<h1>NYOTA FUNDS KENYA</h1>

<div class="message">

Congratulations 🎉 <span id="applicantName"></span><br><br>

You're eligible for <b>NYOTA Funds Limits.</b><br>

Kindly choose the amount you want and pay the processing fee to continue.

</div>

<h2>Select Your NYOTA Fund Amount</h2>

<div class="amount-grid">

<button class="amount-btn" onclick="selectAmount(22000,this)">Ksh 22,000</button>

<button class="amount-btn" onclick="selectAmount(30000,this)">Ksh 30,000</button>

<button class="amount-btn" onclick="selectAmount(40000,this)">Ksh 40,000</button>

<button class="amount-btn" onclick="selectAmount(50000,this)">Ksh 50,000</button>

<button class="amount-btn" onclick="selectAmount(65000,this)">Ksh 65,000</button>

<button class="amount-btn" onclick="selectAmount(75000,this)">Ksh 75,000</button>

<button class="amount-btn" onclick="selectAmount(85000,this)">Ksh 85,000</button>

<button class="amount-btn" onclick="selectAmount(110000,this)">Ksh 110,000</button>

<button class="amount-btn" onclick="selectAmount(150000,this)">Ksh 150,000</button>

</div>

<div id="feeDisplay">
Select an amount to see the processing fee.
</div>

<button class="continue-btn" onclick="continueNext()">
Continue
</button>
<script>

const fees = {
22000:350,
30000:400,
40000:460,
50000:520,
65000:660,
75000:780,
85000:900,
110000:1240,
150000:1500
};

let selectedAmount = null;
  
document.getElementById("applicantName").textContent =
localStorage.getItem("applicantName") || "Applicant";
function selectAmount(amount, btn){

selectedAmount = amount;

document.querySelectorAll(".amount-btn").forEach(button=>{
button.classList.remove("selected");
});

btn.classList.add("selected");

document.getElementById("feeDisplay").innerHTML =
"Processing Fee: <span style='color:#00ff66;'>Ksh " +
fees[amount].toLocaleString() +
"</span>";

localStorage.setItem("selectedAmount", amount);
localStorage.setItem("processingFee", fees[amount]);

}

function continueNext(){

if(selectedAmount === null){
alert("Please select an amount first.");
return;
}

const button = document.querySelector(".continue-btn");

button.textContent = "Processing...";
button.disabled = true;
button.style.opacity = "0.7";
button.style.cursor = "not-allowed";

setTimeout(() => {
    window.location.href = "payment.html";
}, 1000);

}

</script>

</body>
                                                                          </html>
