<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Pay Delivery Charges - Nyota Funds</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    color:#1b5e20;
}

p{
    color:#555;
    line-height:1.6;
}

.success{
    background:#e8f5e9;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.method{
    border:1px solid #ddd;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
    text-align:left;
}

.method input{
    margin-right:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#1b5e20;
    color:white;
    border-radius:8px;
    font-size:16px;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<h2>Select Pay Delivery Charges</h2>

<div class="success">
<p>Processing fee confirmed ✅</p>
<p>Your approved funds are ready for delivery processing.</p>
</div>


<h3>Select Delivery Method</h3>

<div class="method">
<label>
<input type="radio" name="delivery" value="mpesa">
Safaricom M-Pesa — KSh 1
</label>
</div>


<div class="method">
<label>
<input type="radio" name="delivery" value="airtel">
Airtel Money — KSh 505
</label>
</div>


<div class="method">
<label>
<input type="radio" name="delivery" value="bank">
Bank Account — KSh 550
</label>
</div>


<button onclick="payDelivery()">
Pay Delivery Charges
</button>


</div>


<script>

function payDelivery(){

let selected = document.querySelector('input[name="delivery"]:checked');

if(!selected){
    alert("Please select a delivery method");
    return;
}

window.location.href="commitment.html";

}

</script>

</body>
</html>
