<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Pay Delivery Charges - Nyota Funds</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:10px;
}

.container{
    max-width:430px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    color:#1b5e20;
    font-size:21px;
    margin:5px 0 12px;
}

.success-box{
    background:#e8f5e9;
    color:#1b5e20;
    padding:12px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:10px;
}

.confirm-box{
    background:#f1f8e9;
    color:#2e7d32;
    padding:10px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:12px;
}

.details-box{
    background:#fafafa;
    padding:12px;
    border-radius:12px;
    text-align:left;
    font-size:14px;
}

.details-box p{
    margin:8px 0;
}

.method{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
}

.method input{
    margin-right:8px;
}

.fee{
    font-weight:bold;
    color:#1b5e20;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#status{
    margin-top:10px;
    font-size:14px;
    color:#555;
}

.secure{
    font-size:13px;
    color:#777;
    margin-top:10px;
}

</style>

</head>


<body>


<div class="container">


<h2>Select Pay Delivery Charges</h2>


<div class="success-box">

Great news 🎉 <br>

Your NYOTA FUNDS is ready for delivery

</div>


<div class="confirm-box">

✅ Processing fee confirmed

</div>


<div class="details-box">


<p>
<b>NYOTA FUND:</b> KSh 22,000
</p>


<p>
<b>Full Name:</b> <span id="fullName">Loading...</span>
</p>


<p>
<b>Phone Number:</b> <span id="phoneNumber">Loading...</span>
</p>



<b>Select Delivery Method</b>


<div class="method">

<label>

<input type="radio" name="delivery" value="1" onclick="updateFee()">

Safaricom M-Pesa — KSh 1

</label>

</div>



<div class="method">

<label>

<input type="radio" name="delivery" value="550" onclick="updateFee()">

Bank Account — KSh 550

</label>

</div>



<p class="fee">

Delivery Fee: KSh <span id="deliveryFee">--</span>

</p>


</div>



<button onclick="payDelivery()">

Pay Delivery Charges

</button>



<div id="status"></div>


<p class="secure">

🔒 Secure STK Push • Instant Confirmation

</p>


</div>




<script>


// Load applicant details

document.getElementById("fullName").innerHTML =
localStorage.getItem("fullName") || "Applicant";


document.getElementById("phoneNumber").innerHTML =
localStorage.getItem("phoneNumber") || "07XXXXXXXX";




// Update delivery fee

function updateFee(){

let selected = document.querySelector('input[name="delivery"]:checked');

if(selected){

document.getElementById("deliveryFee").innerHTML = selected.value;

}

}




function payDelivery(){

let selected = document.querySelector('input[name="delivery"]:checked');


if(!selected){

alert("Please select delivery method");

return;

}


// STK Push connection will be added here

document.getElementById("status").innerHTML =
"STK Push sent. Complete payment on your phone 📱";

}

</script>


</body>
</html>
