<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fund Application - Purpose</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255, 193, 7, 0.08) 0%,
            rgba(60, 170, 30, 0.035) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #050608 0%,
            #0a0c0d 50%,
            #030405 100%
        );

    color: #fff;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;

    margin: auto;
    padding: 10px 16px;
}

.card {
    width: 100%;
    padding: 22px 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border: 1px solid rgba(255,205,70,0.16);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}

h1 {
    text-align: center;
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: 18px;

    background:
        linear-gradient(
            180deg,
            #fff3ad,
            #ffd54f 35%,
            #e0a51c 65%,
            #9a6509
        );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.question {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 12px;
}

.option {
    display: flex;
    align-items: center;

    width: 100%;
    padding: 12px;

    margin-bottom: 8px;

    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;

    background: rgba(255,255,255,0.045);
    color: rgba(255,255,255,0.90);

    cursor: pointer;

    font-size: 17px;
}

.option input {
    margin-right: 13px;
    transform: scale(1.2);
    accent-color: #e2a91e;
}

.option:has(input:checked) {
    background: rgba(255,193,7,0.15);
    border-color: #e7b52b;
}

button {
    width: 100%;
    min-height: 52px;

    margin-top: 10px;
    padding: 12px;

    border: none;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #fff0a0,
            #ffd34f 30%,
            #e2a91e 65%,
            #a96d08
        );

    color: #171100;

    font-size: 20px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(255,193,7,0.18);
}

button:active {
    transform: scale(0.98);
}

@media (max-width: 480px) {

    .container {
        padding: 8px 14px;
    }

    .card {
        padding: 20px 16px;
    }

    h1 {
        font-size: 27px;
    }

    .question {
        font-size: 19px;
    }

    .option {
        font-size: 16px;
        padding: 10px 11px;
    }

    button {
        font-size: 19px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Fund Application</h1>

        <div class="question">
            What will you do with the funds?
        </div>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Starting a Business"
            >
            Starting a Business
        </label>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Education"
            >
            Education
        </label>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Agriculture"
            >
            Agriculture
        </label>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Home Improvement"
            >
            Home Improvement
        </label>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Personal Development"
            >
            Personal Development
        </label>

        <label class="option">
            <input
                type="radio"
                name="purpose"
                value="Other"
            >
            Other
        </label>

        <button
            type="button"
            id="continueBtn"
            onclick="continueNext()"
        >
            Continue
        </button>

    </div>

</div>

<script>

function continueNext() {

    const selected = document.querySelector(
        'input[name="purpose"]:checked'
    );

    // Prevent continuing without a selection
    if (!selected) {
        alert("Please select a purpose.");
        return;
    }

    // Save the selected purpose
    localStorage.setItem(
        "purpose",
        selected.value
    );

    // Navigate immediately
    window.location.href = "amount.html";
}

</script>

</body>

</html>
