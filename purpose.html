<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', Arial, sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 20px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255, 193, 7, 0.08) 0%,
            rgba(60, 170, 30, 0.035) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #050608 0%,
            #0a0c0d 50%,
            #030405 100%
        );

    color: #fff;
}

.container {
    width: 100%;
    max-width: 450px;
    margin: auto;
}

.card {
    width: 100%;

    padding: 25px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.075),
            rgba(255, 255, 255, 0.025)
        );

    border: 1px solid rgba(255, 193, 7, 0.16);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(255, 193, 7, 0.035),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}

h1 {
    text-align: center;

    margin-bottom: 30px;

    font-size: 28px;
    font-weight: 800;

    background:
        linear-gradient(
            180deg,
            #fff3ad 0%,
            #ffd34f 25%,
            #e0a51c 55%,
            #9a6509 100%
        );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 4px 12px rgba(0, 0, 0, 0.6);
}

.question {
    font-size: 20px;
    font-weight: 700;

    margin-bottom: 20px;

    color: #fff;
}

.option {
    display: flex;
    align-items: center;

    padding: 14px;

    margin-bottom: 12px;

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 10px;

    cursor: pointer;

    font-size: 17px;

    background: rgba(255, 255, 255, 0.045);

    color: rgba(255, 255, 255, 0.90);

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.option:hover {
    background: rgba(255, 193, 7, 0.07);

    border-color: rgba(255, 193, 7, 0.40);

    transform: translateY(-1px);
}

.option:has(input:checked) {
    background:
        linear-gradient(
            135deg,
            rgba(255, 211, 79, 0.16),
            rgba(55, 190, 30, 0.08)
        );

    border-color: rgba(255, 193, 7, 0.75);

    box-shadow:
        0 0 18px rgba(255, 193, 7, 0.08);
}

.option input {
    margin-right: 15px;

    transform: scale(1.3);

    accent-color: #e2a91e;

    cursor: pointer;
}

button {
    width: 100%;

    min-height: 54px;

    padding: 15px;

    margin-top: 25px;

    background:
        linear-gradient(
            135deg,
            #fff0a0 0%,
            #ffd34f 25%,
            #e2a91e 60%,
            #a96d08 100%
        );

    color: #171100;

    border: none;

    border-radius: 12px;

    font-size: 17px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(255, 193, 7, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 35px rgba(255, 193, 7, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* =================================
   MOBILE
================================= */

@media (max-width: 480px) {

    body {
        padding: 16px 14px 30px;
    }

    .card {
        padding: 20px 16px;
        border-radius: 15px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 25px;
    }

    .question {
        font-size: 18px;
    }

    .option {
        padding: 13px;
        font-size: 15px;
    }

    button {
        min-height: 52px;
        font-size: 16px;
    }
}

/* =================================
   SMALL PHONES
================================= */

@media (max-width: 360px) {

    body {
        padding-left: 12px;
        padding-right: 12px;
    }

    .card {
        padding: 18px 13px;
    }

    h1 {
        font-size: 23px;
    }

    .question {
        font-size: 17px;
    }

    .option {
        font-size: 14px;
    }
}
</style>



</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA FUNDS KENYA</h1>

<div class="question">
What will you do with the funds?
</div>

<label class="option">
<input type="radio" name="purpose" value="Starting a Business">
Starting a Business
</label>

<label class="option">
<input type="radio" name="purpose" value="Expanding My Business">
</label>

<label class="option">
<input type="radio" name="purpose" value="Education">
Education
</label>

<label class="option">
<input type="radio" name="purpose" value="Agriculture">
Agriculture
</label>

<label class="option">
<input type="radio" name="purpose" value="Buying Equipment">

</label>

<label class="option">
<input type="radio" name="purpose" value="Home Improvement">
Home Improvement
</label>

<label class="option">
<input type="radio" name="purpose" value="Personal Development">
Personal Development
</label>

<label class="option">
<input type="radio" name="purpose" value="Other">
Other
</label>

<button id="continueBtn" onclick="continueNext()">
    Continue
</button>

</div>

</div>

<script>

function continueNext(){

let selected=document.querySelector('input[name="purpose"]:checked');

if(!selected){
alert("Please select a purpose.");
return;
}

localStorage.setItem("purpose",selected.value);

const button = document.getElementById("continueBtn");
button.textContent = "Processing...";
button.disabled = true;

window.location.href="amount.html";

}

</script>

</body>

</html>
