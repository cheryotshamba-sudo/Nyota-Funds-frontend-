<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>NYOTA FUNDS</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    color:#1f2937;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;
    background:#ffffff;
    padding:22px 18px 18px;
    border-radius:18px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.08);

    border:1px solid #e5e7eb;
}

h1{
    text-align:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    margin:2px 0 16px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.5;
    color:rgba(255,255,255,0.72);
}

.amount{
    background:rgba(155,53,255,0.08);
    border:1px solid rgba(155,53,255,0.18);
    border-radius:12px;
    padding:14px 10px;
    font-size:20px;
    font-weight:700;
    text-align:center;
    color:#fff;
    margin:18px 0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,0.88);
}

input{
    width:100%;
    padding:14px 12px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    font-size:16px;
    background:rgba(255,255,255,0.07);
    color:#fff;
    outline:none;
}

input:focus{
    border-color:rgba(169,72,255,0.8);
    box-shadow:0 0 0 3px rgba(155,55,255,0.12);
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;
    background:linear-gradient(135deg,#9B35FF,#6C1DCE);
    color:white;
    border:none;
    border-radius:11px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(137,43,226,0.30);
}

button:active{
    transform:scale(.98);
}

#message{
    min-height:20px;
    margin-top:13px;
    color:#B86CFF;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h1{
        font-size:20px;
    }

    button{
        padding:14px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Processing Fee</h1>

<p>
Welcome, <strong>Cheryot</strong>
</p>

<p>
To continue with your NYOTA Fund application,
please complete the processing fee payment below.
</p>

<div class="amount">
Processing Fee: KSh 350
</div>

<label>Full Name</label>

<input
    type="text"
    id="fullName"
    value="Cheryot"
    readonly
>

<label>M-PESA Phone Number</label>

<input
    type="tel"
    id="phone"
    placeholder="2547XXXXXXXX"
>

<button id="payBtn" onclick="payNow()">
Pay Processing Fee
</button>

<p id="message"></p>

</div>

</div>

<script>
function payNow(){

    const phone =
        document.getElementById("phone").value.trim();

    const message =
        document.getElementById("message");

    if(phone === ""){
        message.textContent =
            "Please enter your M-PESA phone number.";
        return;
    }

    message.textContent =
        "Demo mode: no payment has been processed.";
}
</script>

</body>
</html>
