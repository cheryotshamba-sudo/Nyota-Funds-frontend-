<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA Fund Kenya - Application</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255, 193, 7, 0.08) 0%,
            rgba(60, 170, 30, 0.035) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #050608 0%,
            #0a0c0d 50%,
            #030405 100%
        );
    color: #fff;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    padding: 10px 16px;
}

.card {
    width: 100%;
    padding: 20px 18px;
    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border: 1px solid rgba(255,205,70,0.16);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        0 0 35px rgba(255,193,7,0.035),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}

h1 {
    text-align: center;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 700;
    margin-bottom: 6px;

    background:
        linear-gradient(
            180deg,
            #fff3ad 0%,
            #ffd54f 25%,
            #e0a51c 55%,
            #9a6509 100%
        );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    text-align: center;
    font-size: 16px;
    line-height: 1.35;
    color: rgba(255,255,255,0.72);
    margin-bottom: 12px;
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.90);
}

input,
select {
    width: 100%;
    height: 45px;
    padding: 0 13px;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 11px;
    outline: none;

    background: rgba(255,255,255,0.055);
    color: #fff;

    font-size: 14px;
}

input::placeholder {
    color: rgba(255,255,255,0.42);
}

input:focus,
select:focus {
    border-color: rgba(255,197,45,0.85);

    box-shadow:
        0 0 0 3px rgba(255,193,7,0.10);
}

select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
}

select option {
    background: #0b0d0e;
    color: #fff;
}

button {
    width: 100%;
    min-height: 50px;
    padding: 10px;
    margin-top: 14px;

    border: none;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #fff0a0 0%,
            #ffd34f 25%,
            #e2a91e 60%,
            #a96d08 100%
        );

    color: #171100;
    font-size: 20px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(255,193,7,0.18),
        inset 0 1px 0 rgba(255,255,255,0.55);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.7;
    cursor: wait;
}

@media (max-width:480px) {

    .container {
        padding: 8px 14px;
    }

    .card {
        padding: 18px 16px;
    }

    h1 {
        font-size: 27px;
    }

    p {
        font-size: 15px;
    }

    label {
        font-size: 15px;
    }

    input,
    select {
        height: 43px;
        font-size: 14px;
    }

    button {
        min-height: 49px;
        font-size: 19px;
    }
}

@media (max-width:360px) {

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .card {
        padding: 17px 13px;
    }

    h1 {
        font-size: 24px;
    }

    p {
        font-size: 14px;
    }

    label {
        font-size: 14px;
    }

    input,
    select {
        height: 41px;
        font-size: 13px;
    }

    button {
        font-size: 18px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA Fund Application</h1>

<p>Please complete all fields below.</p>

<form id="applicationForm">

<label>Full Name</label>

<input
    type="text"
    id="applicantName"
    placeholder="Enter your full name"
    required
>

<label>National ID Number</label>

<input
    type="number"
    id="idNumber"
    placeholder="Enter your ID Number"
    required
>

<label>Phone Number</label>

<input
    type="tel"
    id="phoneNumber"
    placeholder="07XXXXXXXX"
    required
>

<label>County</label>

<select id="county" required>

<option value="">Select County</option>

<option>Baringo</option>
<option>Bomet</option>
<option>Bungoma</option>
<option>Busia</option>
<option>Elgeyo-Marakwet</option>
<option>Embu</option>
<option>Garissa</option>
<option>Homa Bay</option>
<option>Isiolo</option>
<option>Kajiado</option>
<option>Kakamega</option>
<option>Kericho</option>
<option>Kiambu</option>
<option>Kilifi</option>
<option>Kirinyaga</option>
<option>Kisii</option>
<option>Kisumu</option>
<option>Kitui</option>
<option>Kwale</option>
<option>Laikipia</option>
<option>Lamu</option>
<option>Machakos</option>
<option>Makueni</option>
<option>Mandera</option>
<option>Marsabit</option>
<option>Meru</option>
<option>Migori</option>
<option>Mombasa</option>
<option>Murang'a</option>
<option>Nairobi</option>
<option>Nakuru</option>
<option>Nandi</option>
<option>Narok</option>
<option>Nyamira</option>
<option>Nyandarua</option>
<option>Nyeri</option>
<option>Samburu</option>
<option>Siaya</option>
<option>Taita Taveta</option>
<option>Tana River</option>
<option>Tharaka-Nithi</option>
<option>Trans Nzoia</option>
<option>Turkana</option>
<option>Uasin Gishu</option>
<option>Vihiga</option>
<option>Wajir</option>
<option>West Pokot</option>

</select>

<label>Occupation</label>

<select id="occupation" required>

<option value="">Select Occupation</option>

<option>Student</option>
<option>Business Owner</option>
<option>Self Employed</option>
<option>Employed</option>
<option>Farmer</option>
<option>Teacher</option>
<option>Doctor</option>
<option>Nurse</option>
<option>Engineer</option>
<option>Software Developer</option>
<option>Accountant</option>
<option>Lawyer</option>
<option>Driver</option>
<option>Mechanic</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Carpenter</option>
<option>Welder</option>
<option>Tailor</option>
<option>Hairdresser / Barber</option>
<option>Trader</option>
<option>Salesperson</option>
<option>Hotel Attendant</option>
<option>Chef / Cook</option>
<option>Security Guard</option>
<option>Police Officer</option>
<option>Military Officer</option>
<option>Journalist</option>
<option>Graphic Designer</option>
<option>Photographer</option>
<option>Freelancer</option>
<option>Content Creator</option>
<option>Casual Worker</option>
<option>Unemployed</option>
<option>Retired</option>
<option>Other</option>

</select>

<button type="submit" id="continueBtn">
Continue
</button>

</form>

</div>

</div>

<script>

document
.getElementById("applicationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const button =
        document.getElementById("continueBtn");

    const name =
        document.getElementById("applicantName")
        .value
        .trim();

    /*
       Save application information
    */

    localStorage.setItem(
        "applicantName",
        name
    );

    sessionStorage.setItem(
        "nyotaApplicationActive",
        "true"
    );

    sessionStorage.setItem(
        "nyotaCurrentStep",
        "2"
    );

    /*
       Navigate immediately.
       No setTimeout or artificial delay.
    */

    button.textContent = "Opening...";
    button.disabled = true;

    window.location.href = "purpose.html";

});

</script>

</body>

</html>
